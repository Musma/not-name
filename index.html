function footWorker(a, mode, st, draft, rate){
  const p = perf(a, mode);
  const saved = p.rate!=null;
  const head = `${p.approvedAt?`<span class="meta">승인 : ${p.approvedAt}</span>`:''}
    <span class="sp" style="flex:1"></span>`;
  if(st==='wait')
    /* 승인대기 : 입력은 잠기지만 관리자가 처리하기 전까지는 회수할 수 있다 (V62) */
    return head + `${docChip(p.docNo)}
      <span class="meta" style="margin-right:2px">승인요청 ${p.requestedAt||''}</span>
      <button class="btn" data-act="cancelreq"><i class="bi bi-arrow-counterclockwise"></i>요청 취소</button>`;
  if(isClosed(a) || mode==='outtake')
    return head + `<span class="tag t-done"><i class="bi bi-lock-fill"></i> 종결된 액티비티입니다 — 수정할 수 없습니다</span>`;
  const curRate = draft ? draft.rate : baseRate(a, mode);
  const appr = st==='done' ? (p.prevRate ?? p.rate) : null;   /* 승인 확정된 공정율 (V61) */
  const canReq = appr!=null ? curRate>appr : (draft ? draft.rate>0 : saved);
  const willClose = curRate>=100;   /* 100% 승인 = 종결 (V61) */
  return head + `<button class="btn" data-act="revert" ${draft?'':'disabled'}>초기화</button>
         <button class="btn" data-act="save" ${draft?'':'disabled'} title="${draft?'입력값을 저장합니다 (승인요청 전까지 수정 가능)':'변경된 입력값이 없습니다'}">임시저장</button>
         <button class="btn pri" data-act="request" ${canReq?'':'disabled'} title="${
            !canReq ? (appr!=null ? `승인된 공정율(${appr}%)보다 높은 값을 입력해 주세요` : '공정율을 입력해 주세요')
              : willClose ? '공정율 100% — 승인되면 액티비티가 종결됩니다'
                          : '작업조직 확정 후 관리조직 승인을 요청합니다 (공정율 확정 결재)'
          }"><i class="bi bi-send-check"></i>승인요청</button>`;
}
/* 실적확인(조회) 액션바 — 확정된 사실만 읽는다. 결재로 넘어가는 통로를 두지 않는다 (V66) */
function footViewOnly(a, mode, st){
  const p = perf(a, mode);
  const cf = confirmState(a);
  const r = apprRate(a);
  const when = r == null ? '승인된 실적 없음'
    : (p.status==='done'
        ? `최종 승인 : ${p.approvedAt||'-'}${p.approvedBy?` · ${esc(p.approvedBy)}`:''}`
        : `최종 확정 공정율 ${r}% · 이후 진척은 결재 진행 중`);
  return `${docChip(apprDoc(a))}<span class="meta">${when}</span>
    <span class="sp" style="flex:1"></span>
    <span class="tag ${ST_CLS[cf.st]}">${cf.t}</span>
    <span class="tag t-gray"><i class="bi bi-eye"></i> 조회 전용</span>`;
}

function footManager(a, mode, st){
  const p = perf(a, mode);
  const can = st==='wait';
  /* 종결(공정율 100% 승인) = 최종 확정 — 취소 불가. 정정은 시스템 밖 관리 절차로 처리한다.
     종결 전 진척 승인은 되돌릴 수 있다 (V61). */
  if(isClosed(a))
    return `<span class="meta">승인 완료 (종결) : ${perf(a,'intake').approvedAt||'-'}${
        perf(a,'intake').approvedBy?` · ${esc(perf(a,'intake').approvedBy)}`:''}</span>
      <span class="sp" style="flex:1"></span>
      <span class="tag t-done"><i class="bi bi-lock-fill"></i> 종결된 액티비티입니다 — 취소할 수 없습니다</span>`;
  if(st==='done'){
    return `<span class="meta">승인 완료 : ${p.approvedAt||'-'}${p.approvedBy?` · ${esc(p.approvedBy)}`:''}</span>
      <span class="sp" style="flex:1"></span>
      <button class="btn" data-act="unapprove"
        title="승인을 취소하고 승인대기로 되돌립니다"><i class="bi bi-arrow-counterclockwise"></i>승인 취소</button>`;
  }
  return `<span class="meta">${p.requestedAt? `승인요청 : ${p.requestedAt}` : '승인요청 전'}</span>
    <span class="sp" style="flex:1"></span>
    <button class="btn no" data-act="reject" ${can?'':'disabled'}><i class="bi bi-x-circle"></i>반려</button>
    <button class="btn ok" data-act="approve" ${can?'':'disabled'}><i class="bi bi-check2-circle"></i>${mode==='outtake'?'승인 · 종결':'승인'}</button>`;
}




/* ============================================================
   화면 : 승인함 (SCR-600) — 관리자 결재 전용
     · 착수/완료를 나누지 않고 '올라온 요청'을 요청순 한 목록으로 처리한다.
     · 결재(승인·반려·승인취소·일괄처리)는 이 화면에서만 한다 (V65).
       실적확인은 '누락'까지 포함한 전체 현황 조회 전용이다.
   ============================================================ */
/* 입력이 필요한 1건 = (액티비티, 실적구분) 조합.
   승인 후 다음 진척을 올려야 하는 건까지 한 목록으로 모은다.
   (승인자의 승인함과 대칭 : 승인함은 '올라온 것', 여기는 '올려야 할 것') */
function todoRows(){
  const q = S.quick; S.quick = 'all';
  const rows = [];
  /* 완료 실적은 100% 승인 시 자동 기록되므로 입력 대상이 아니다 (V61) */
  filteredActs('intake').forEach(a=>{
    const st = statusOf(a, 'intake');
    /* 미등록 · 반려 + 승인은 됐지만 아직 100%가 아닌 건(다음 진척 입력) */
    if(!(st==='none' || st==='rej' || (st==='done' && !isClosed(a)))) return;
    rows.push({ a, mode:'intake', key:`${a.id}|intake`, st,
                due: a.planEnd, late: isLate(a) });
  });
  S.quick = q;
  // 지연 > 반려(재입력) > 계획완료일 순
  return rows.sort((x,y)=> (y.late - x.late)
                        || ((y.st==='rej') - (x.st==='rej'))
                        || x.due.localeCompare(y.due));
}

/* 승인 요청 1건 = 액티비티 1건의 진척 승인 요청 (V61 — 결재는 한 종류) */
function apprRows(){
  /* 공정(그룹/세부) 필터는 승인함에 해당 칩이 없으므로 무시한다. */
  const q = S.quick, g = S.grp, st0 = S.stage;
  S.quick = 'all'; S.grp = 'all'; S.stage = 'all';
  const rows = [];
  filteredActs('intake').forEach(a=>{
    if(statusOf(a, 'intake') !== 'wait') return;
    const p = perf(a, 'intake');
    rows.push({ a, mode:'intake', key:`${a.id}|intake`, at:p.requestedAt || '',
                age: p.requestedAt ? Math.max(0, dayDiff(p.requestedAt.slice(0,10), TODAY)) : 0 });
  });
  S.quick = q; S.grp = g; S.stage = st0;
  // 오래 묵은 요청 우선 → 지연 건 우선 → 요청시각순
  return rows.sort((x,y)=> y.age-x.age || (isLate(y.a)-isLate(x.a)) || x.at.localeCompare(y.at));
}
/* 처리 완료(기결) — 내가 승인·반려한 건을 처리시각 역순으로 */
function apprDoneRows(){
  const q = S.quick, g = S.grp, st0 = S.stage;
  S.quick = 'all'; S.grp = 'all'; S.stage = 'all';
  const rows = [];
  ['intake','outtake'].forEach(mode=>{
    filteredActs(mode).forEach(a=>{
      const st = statusOf(a, mode);
      const p = perf(a, mode);
      if(mode==='outtake' && p.auto) return;   // 자동 종결분은 착수 행이 대표한다 (V61)
      if(st==='done' && p.approvedAt) rows.push({a, mode, key:`${a.id}|${mode}`, at:p.approvedAt, res:'done'});
      else if(st==='rej'){
        const h = a.history.find(x=>x.kind==='반려' && x.mode===mode);
        rows.push({a, mode, key:`${a.id}|${mode}`, at:(h&&h.at)||'', res:'rej'});
      }
    });
  });
  S.quick = q; S.grp = g; S.stage = st0;
  return rows.sort((x,y)=> y.at.localeCompare(x.at));
}
/* 승인함 기간 필터 — 대기 탭은 요청일, 처리 완료 탭은 처리일 기준 */
function apprInRange(r){
  const {from, to} = S.dRange;
  if(!from && !to) return true;
  const d = (r.at||'').slice(0,10);
  return !!d && d >= (from||'0000-01-01') && d <= (to||'9999-12-31');
}

/* 레일 배지·홈 링크용 — 검색어·조회 필터와 무관한 전체 승인 대기 건수 */
function apprTotal(){
  let n = 0;
  ['intake','outtake'].forEach(mode=>scopeActs().forEach(a=>{
    if(mode==='outtake' && !intakeComplete(a)) return;
    if(statusOf(a, mode)==='wait') n++;
  }));
  return n;
}

function apprDoneRowHTML(r){
  const {a, mode, at, res} = r;
  const p = perf(a, mode);
  const sel = S.selectedId===a.id && S.tab===mode;
  return `<button class="row ${res==='done'?'k-done':'k-rej'} ${sel?'rowsel':''}" data-arow="${r.key}">
    <span></span><span class="bar"></span>
    <span><span class="m1">${docChip(p.docNo, true)}<span class="id">${a.id}</span>
      <span class="tag ${res==='done'?'t-done':'t-rej'}">${
        res==='done' ? (a.outtake.status==='done' ? '승인완료 · 종결' : '승인완료') : '반려'}</span></span>
    <span class="m2"><b>${blkLabel(a)}</b> · <span title="작업설명 : ${esc(a.stage)}">${stageOf(a)}</span> · ${esc(a.company)}<br>처리 ${at||'-'}${
      res==='done'&&p.approvedBy?` · ${esc(p.approvedBy)}`:''}${
      res==='rej'&&p.rejCode?` · 사유 : ${esc(p.rejCode)}`:''}</span></span>
    <span class="right">${p.rate!=null?`<span class="pct">${p.rate}<small>%</small></span>`:'<span class="pct none">—</span>'}</span>
  </button>`;
}

function apprRowHTML(r){
  const {a, mode} = r;
  const p = perf(a, mode);
  const prev = p.prevRate;
  const gap = prev==null ? null : Math.round((p.rate - prev)*10)/10;
  const sel = S.selectedId===a.id && S.tab===mode;
  /* 대기 탭은 상태가 전부 '승인대기' — 라벨을 반복하지 않는다 (V61) */
  const tags = [];
  { const lt = lateOrRiskTag(a); if(lt) tags.push(lt); }
  if(p.rejCount) tags.push(`<span class="tag t-rej">${p.rejCount}회 반려</span>`);
  return `<button class="row ap-row k-wait ${isLate(a)?'k-late':''} ${sel?'rowsel':''}" data-arow="${r.key}">
    <span class="ckbox ${S.checked.includes(r.key)?'on':''}" data-check="${r.key}"><i class="bi bi-check-lg"></i></span>
    <span class="bar"></span>
    <span><span class="m1">${docChip(p.docNo, true)}<span class="id">${a.id}</span>${tags.join('')}</span>
    <span class="m2"><b>${blkLabel(a)}</b> · <span title="작업설명 : ${esc(a.stage)}">${stageOf(a)}</span> · ${esc(a.company)}<br>${
      esc(p.requestedBy||'-')} 확정 ${p.requestedAt? p.requestedAt.slice(5) : '-'}
      <span class="ap-age ${r.age>=1?'warn':''}">${r.at? (r.age>=1?`${r.age}일 경과`:'오늘') : '시각 미상'}</span></span></span>
    <span class="right ap-right">
      <span class="pct">${p.rate}<small>%</small></span>
      <span class="ap-mv">${gap!=null?`<b>${prev}</b> → <b class="${gap>0?'up':''}">${p.rate}</b> · ${gap>0?'+':''}${gap}%p`:'최초 요청'}</span>
    </span>
  </button>`;
}

function viewAppr(){
  const pendAll = apprRows().filter(apprInRange);        // 구분 미적용 (칩 건수 기준)
  const doneAll = apprDoneRows().filter(apprInRange);
  const isDone = S.apprView==='done';
  const base0 = isDone ? doneAll : pendAll;
  const base = (isDone && S.apprRes!=='all') ? base0.filter(r=>r.res===S.apprRes) : base0;
  const rows = base;
  // 대기 탭 진입 시 첫 요청을 자동으로 열어 목록→상세 탭을 한 번 줄인다
  if(!isDone && rows.length && !rows.some(r=>r.a.id===S.selectedId && r.mode===S.tab)){
    S.selectedId = rows[0].a.id; S.tab = rows[0].mode;
  }
  const keys = rows.map(r=>r.key);
  const picked = S.checked.filter(k=>keys.includes(k));
  return `<div class="split">
    <section class="pane">
      <div class="pane-head">
        <div class="seg">
          <button class="${!isDone?'on':''}" data-aview="pending">대기 ${pendAll.length}</button>
          <button class="${isDone?'on':''}" data-aview="done">처리 완료 ${doneAll.length}</button>
        </div>
        <span class="cnt">표시 <b>${rows.length}</b>건</span>
        <span class="sp"></span>
        ${isDone ? '' : `<button class="ap-all" data-act="apprall">
          <span class="ckbox ${picked.length && picked.length===rows.length?'on':''}"><i class="bi bi-check-lg"></i></span>
          전체 선택</button>`}
      </div>
      <div class="quickbar" ${isDone?'':'style="display:none"'}>
        ${isDone ? [['all','전체'],['done','승인'],['rej','반려']].map(([k,t])=>
          `<button class="chip ares ${S.apprRes===k?'on':''}" data-ares="${k}">${t}<span class="n">${
            k==='all'?base0.length:base0.filter(r=>r.res===k).length}</span></button>`).join('') : ''}
      </div>
      <div class="ap-bulk ${isDone?'':(picked.length?'on':'')}" ${isDone?'style="display:none"':''}>
        <span class="n">선택 <b>${picked.length}</b>건</span>
        <span class="sp" style="flex:1"></span>
        <button class="btn no" data-act="bulkreject" ${picked.length?'':'disabled'}><i class="bi bi-x-circle"></i>일괄 반려</button>
        <button class="btn ok" data-act="bulkapprove" ${picked.length?'':'disabled'}><i class="bi bi-check2-circle"></i>일괄 승인</button>
      </div>
      <div class="pane-body" id="apprlist">
        ${isDone
          ? (rows.length ? rows.map(apprDoneRowHTML).join('')
             : `<div class="ap-empty">${emptyHTML('처리 완료된 건이 없습니다','승인·반려 처리한 요청이 여기에 표시됩니다.')}</div>`)
          : (rows.length ? rows.map(apprRowHTML).join('')
             : `<div class="ap-empty">${emptyHTML('처리할 승인 요청이 없습니다','새 요청이 접수되면 이 목록에 표시됩니다.')}</div>`)}
      </div>
    </section>
    <section class="pane ${S.selectedId?'':'hide'}">${inspectorHTML()}</section>
  </div>`;
}

/* 일괄 처리 : 선택 건을 한 번에 승인하거나, 사유 1회 입력으로 반려한다. */
function bulkApprove(){
  const keys = S.checked.slice();
  if(!keys.length){ toast('선택된 요청이 없습니다.','warn'); return; }
  /* 종결(공정율 100%)이 포함될 때만 확인 — 그 외는 즉시 처리 (V61) */
  const hasOut = keys.some(k=>{ const [id,m]=k.split('|'); const x=actById(id);
    return x && (perf(x,m).rate??0)>=100; });
  if(!hasOut){ doBulkApprove(keys); return; }
  const bd = $('#backdrop');
  bd.innerHTML = `<div class="modal">
    <div class="modal-h"><h3>일괄 승인</h3><p>선택한 <b>${keys.length}건</b>을 승인 처리합니다.</p></div>
    <div class="modal-b"><div class="ap-note warn"><i class="bi bi-lock-fill"></i><span>공정율 100% 건이 포함되어 있습니다 — 승인 시 해당 액티비티는 <b>종결</b>되며 취소할 수 없습니다.</span></div></div>
    <div class="modal-f"><button class="btn" id="ap-cancel">취소</button>
      <button class="btn ok" id="ap-ok"><i class="bi bi-check2-circle"></i>일괄 승인</button></div></div>`;
  bd.classList.add('on');
  $('#ap-cancel').onclick = ()=> bd.classList.remove('on');
  bd.onclick = e=>{ if(e.target===bd) bd.classList.remove('on'); };
  $('#ap-ok').onclick = ()=>{ bd.classList.remove('on'); doBulkApprove(keys); };
}
function doBulkApprove(keys){
  let ok = 0;
  keys.forEach(k=>{
    const [id, mode] = k.split('|');
    const a = actById(id);
    if(!a || statusOf(a, mode)!=='wait') return;
    const p = perf(a, mode);
    const from = p.prevRate;
    p.status='done'; p.approvedAt = nowStamp(); p.approvedBy = S.user.name;
    p.prevRateBefore = from; p.prevRate = p.rate;    // 취소 시 되돌릴 값 보존 (V79)
    p.perfDate = p.perfDate || TODAY;
    log(a,'승인',`공정율 ${from==null?'':from+'% → '}${p.rate}% 일괄 승인`, mode);
    const closed = mode==='intake' && p.rate>=100 && autoClose(a, p.approvedAt, p.approvedBy);
    pushNoti({act:a.id, type:'approved', to:a.company, role:'worker', doc:p.docNo,
      desc:closed ? `공정율 100%가 승인되어 액티비티가 종결되었습니다.`
                  : `실적이 승인 처리되었습니다. (공정율 ${p.rate}%)`});
    ok++;
  });
  S.checked = []; S.selectedId = null;
  toast(`${ok}건을 일괄 승인했습니다.`, 'ok');
  render();
}

function bulkReject(code, memo){
  const keys = S.checked.slice();
  let ok = 0;
  keys.forEach(k=>{
    const [id, mode] = k.split('|');
    const a = actById(id);
    if(!a || statusOf(a, mode)!=='wait') return;
    const p = perf(a, mode);
    const doc = p.docNo;
    p.status='rej'; p.rejCode=code; p.rejMemo=memo||''; p.rejAt=nowStamp(); p.rejBy=S.user.name;
    p.requestedAt = null; p.rejCount = (p.rejCount||0) + 1;
    log(a,'반려',`[${doc||'-'}] 공정율 ${p.rate}% 일괄 반려 (사유 : ${code}${memo?' / '+memo:''}) · 등록값 유지`,
        mode, null, doc);
    pushNoti({act:a.id, type:'rejected', to:a.company, role:'worker', doc,
      desc:`실적이 반려되었습니다. 등록값은 유지되니 확인 후 다시 요청해 주세요. (사유 : ${code})`});
    ok++;
  });
  S.checked = []; S.selectedId = null;
  toast(`${ok}건을 일괄 반려했습니다.`, 'warn');
  render();
}

/* ============================================================
   화면 : 계획일정 (SCR-500) — 계획 대비 실적 간트
   ============================================================ */
const SCHED_RANGE = { '2w':{t:'2주', d:14}, '4w':{t:'4주', d:28}, '8w':{t:'8주', d:56} };

/* 공정율 : 완료 실적이 등록되면 완료 기준, 아니면 착수 기준 */
/* 계획일정의 실적 = 승인 확정 공정율 (V66) — 결재 전 값은 계획 대비 진척으로 치지 않는다 */
function schedRate(a){ return apprRate(a); }

/* 계획 진척률 : 금일 기준 계획 기간의 경과 비율 (0~100)
   공정율과 나란히 비교하여 계획 대비 앞섰는지/뒤졌는지를 판단한다. */
function planRate(a){
  const span = dayDiff(a.planStart, a.planEnd);
  if(span <= 0) return dayDiff(TODAY, a.planStart) <= 0 ? 100 : 0;
  return Math.max(0, Math.min(100, Math.round(dayDiff(a.planStart, TODAY) / span * 100)));
}

function viewSched(){
  const list = filteredActs('intake');
  const R = SCHED_RANGE[S.schedRange] || SCHED_RANGE['4w'];

  // 시간축 : 기간 조회가 지정되면 그 기간이 축 — 아니면 금일 기준 앞 7일 ~ 범위 종료
  const addD = (iso,n)=>{ const [y,m,d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m-1, d+n)).toISOString().slice(0,10); };
  const cf = S.dRange.from, ct = S.dRange.to, custom = !!(cf || ct);
  let startISO, total;
  if(custom){
    let f = cf || addD(ct, -R.d), t = ct || addD(cf, R.d);
    if(f > t) [f, t] = [t, f];
    startISO = addD(f, -2);                                    /* 좌우 2일 여백 */
    total = Math.max(7, dayDiff(startISO, addD(t, 2)));
  }else{
    const b0 = new Date(TODAY + 'T00:00:00'); b0.setDate(b0.getDate() - 7);
    startISO = b0.toISOString().slice(0,10);
    total = R.d + 7;
  }
  const base = new Date(startISO + 'T00:00:00');
  const todayIn = dayDiff(startISO, TODAY) >= 0 && dayDiff(startISO, TODAY) <= total;
  const pos = d => Math.max(0, Math.min(100, dayDiff(startISO, d) / total * 100));
  const seg = (s,e) => {
    const l = pos(s), r = pos(e);
    return { left:l, width: Math.max(1.2, r - l),
             clipL: dayDiff(startISO, s) < 0, clipR: dayDiff(startISO, e) > total };
  };
  // 주(월요일) 단위 눈금 — 시작·종료일은 고정 표기, 끝단과 겹치는 주 눈금은 생략
  const dlab = d => `${d2(d.getMonth()+1)}/${d2(d.getDate())}`;
  const ticks = [[0, dlab(base), 'd0']];
  for(let i=1;i<total;i++){
    const d = new Date(base); d.setDate(d.getDate()+i);
    const p = i/total*100;
    if(d.getDay()===1 && p>=6 && p<=93 && (!todayIn || Math.abs(p - pos(TODAY)) > 5)) ticks.push([p, dlab(d), '']);
  }
  const endD = new Date(base); endD.setDate(endD.getDate()+total);
  ticks.push([100, dlab(endD), 'dend']);


  const SORTS = {
    plan:(a,b)=> a.planStart.localeCompare(b.planStart) || a.id.localeCompare(b.id),
    late:(a,b)=> (isLate(b)-isLate(a)) || (lateDays(b)-lateDays(a)) || a.planStart.localeCompare(b.planStart),
    rate:(a,b)=> ((schedRate(a)??-1)-(schedRate(b)??-1)) || a.planStart.localeCompare(b.planStart),
    hull:(a,b)=> a.hull.localeCompare(b.hull) || a.block.localeCompare(b.block) || a.id.localeCompare(b.id),
    stage:(a,b)=> (stageOrder(a)-stageOrder(b)) || a.planStart.localeCompare(b.planStart) || a.id.localeCompare(b.id),
  };
  const endAxis = addD(startISO, total);
  const inRange = list.filter(a=>{
    const e = a.expEnd || a.planEnd;
    return e >= startISO && a.planStart <= endAxis;    /* 축 기간과 겹치는 건만 */
  }).sort(SORTS[S.schedSort] || SORTS.plan);

  const cntDone = inRange.filter(a=>a.outtake.status==='done').length;
  const cntLate = inRange.filter(isLate).length;
  const cntRun  = inRange.filter(a=>a.intake.rate!=null && a.outtake.status!=='done').length;
  const cntNone = inRange.filter(a=>a.intake.rate==null).length;
  const FILT = {
    run:  a=>a.intake.rate!=null && a.outtake.status!=='done',
    none: a=>a.intake.rate==null,
    done: a=>a.outtake.status==='done',
    late: isLate,
  };
  const shown = FILT[S.schedFilt] ? inRange.filter(FILT[S.schedFilt]) : inRange;

  if(!list.length) return `<div class="card" style="height:100%">${
    emptyHTML('표시할 일정이 없습니다','필터 또는 검색 조건을 변경해 주세요.')}</div>`;

  return `
  <div class="gt-sum">
    <button class="b ${S.schedFilt==='all'?'on':''}" data-schedfilt="all"><div class="k">표시 대상</div><div class="v">${inRange.length}<span style="font-size:12px">건</span></div></button>
    <button class="b ${S.schedFilt==='run'?'on':''}" data-schedfilt="run"><div class="k">진행 중</div><div class="v">${cntRun}<span style="font-size:12px">건</span></div></button>
    <button class="b nn ${S.schedFilt==='none'?'on':''}" data-schedfilt="none"><div class="k">미착수</div><div class="v">${cntNone}<span style="font-size:12px">건</span></div></button>
    <button class="b done ${S.schedFilt==='done'?'on':''}" data-schedfilt="done"><div class="k">완료</div><div class="v">${cntDone}<span style="font-size:12px">건</span></div></button>
    <button class="b late ${S.schedFilt==='late'?'on':''}" data-schedfilt="late"><div class="k">지연</div><div class="v">${cntLate}<span style="font-size:12px">건</span></div></button>
    <span class="sp" style="flex:1"></span>
    <select class="sel" id="gt-sort" style="align-self:center;height:38px" title="정렬 기준">
      <option value="plan" ${S.schedSort==='plan'?'selected':''}>월간계획착수일순</option>
      <option value="late" ${S.schedSort==='late'?'selected':''}>지연 우선</option>
      <option value="rate" ${S.schedSort==='rate'?'selected':''}>공정율 낮은순</option>
      <option value="hull" ${S.schedSort==='hull'?'selected':''}>호선·블록순</option>
      <option value="stage" ${S.schedSort==='stage'?'selected':''}>공정순</option>
    </select>
    <div class="seg" style="align-self:center;">
      ${custom ? `<button class="on" data-act="toggledr" title="기간 조회로 지정한 표시 기간 · 누르면 수정"><i class="bi bi-calendar-range"></i> 지정 기간</button>` : ''}
      ${Object.entries(SCHED_RANGE).map(([k,v])=>
        `<button class="${!custom && S.schedRange===k?'on':''}" data-range="${k}">${v.t}</button>`).join('')}
    </div>
  </div>

  <div class="card" style="height:calc(100% - 66px);">
    <div class="card-h"><h3>계획 대비 실적</h3><span class="sp" style="flex:1"></span>
      <div class="gt-legend">
        <span><em style="background:#D5DCE4;border:1px solid #C2CBD6"></em>계획 기간</span>
        <span><em style="background:var(--c-brand-500)"></em>공정율 (색상은 실적 상태)</span>
        <span><em style="background:repeating-linear-gradient(45deg,var(--st-late),var(--st-late) 3px,#D8536E 3px,#D8536E 6px)"></em>지연 연장</span>
        <span><em style="background:var(--c-accent);width:3px;border-radius:0"></em>금일</span>
        <span><em style="width:3px;border-radius:0;background:transparent;border-left:2px dotted #4A5A69"></em>계획 기준(금일)</span>
      </div></div>
    <div class="card-b" style="padding:0;">
      ${shown.length ? `<div class="gt-wrap">
        <div class="gt-head">
          <span class="gt-col">실행Activity · 블록 · 공정</span>
          <div class="gt-scale">${ticks.map(([p,t,c])=>`<span class="${c}" style="left:${p}%">${t}</span>`).join('')}${todayIn?`<span class="td" style="left:${pos(TODAY)}%">오늘</span>`:''}</div>
          <span class="gt-col r">공정율 / 계획 대비</span>
        </div>
        <div class="gt-body">
        ${shown.map(a=>{
          const st   = statusOf(a,'intake');
          const ost  = a.outtake.status;
          const plan = seg(a.planStart, a.planEnd);
          const rate = schedRate(a);
          const pr   = planRate(a);
          const late = isLate(a);
          const extEnd = a.expEnd && dayDiff(a.planEnd, a.expEnd) > 0 ? a.expEnd : null;
          const ext  = extEnd ? seg(a.planEnd, extEnd) : null;
          const cls  = ost==='done' ? 'done' : (st==='rej' ? 'rej' : (st==='wait' ? 'wait' : ''));
          // 상태 : 종결되면 종결, 아니면 진척 결재 상태 (V61)
          const sst  = ost==='done' ? 'done' : st;
          /* 조회 화면이므로 승인 확정 시점의 W/O 상태를 센다 (V66 규칙) */
          const woDone = apprWO(a).filter(w=>w.done).length;
          // 실적 바 : 계획 구간 위에 공정율만큼 그려 계획 대비 진척을 직접 대조
          const actW = rate==null ? 0 : plan.width * rate / 100;
          const gap  = rate==null ? null : Math.round((rate - pr)*10)/10;   // 계획 대비 (+ 선행 / − 지연)
          return `<div class="gt-row" data-open="${a.id}" title="클릭하면 상세로 이동합니다">
            <div class="gt-lb">
              <div class="gt-id"><span class="no">${a.id}</span>
                <span class="tag ${ST_CLS[stageStatus(a).st]}">${stageStatus(a).t}</span>
                ${late?`<span class="tag t-late">${a.expEnd?`지연 D+${lateDays(a)}`:'완료예정일 미지정'}</span>`:''}</div>
              <button data-open="${a.id}">${blkLabel(a)} · ${stageOf(a)}</button>
              <small>${a.grp} · ${a.shop}${isWorker()?'':' · '+esc(a.company)}${
                a.org?' · '+esc(a.org):''}</small>
              <span class="mh">W/O <span class="wo">${woDone}/${a.woCount}</span> 완료</span>
            </div>
            <div class="gt-track">
              <div class="gt-grid">${ticks.map(([p])=>`<i style="left:${p}%"></i>`).join('')}</div>
              <div class="gt-plan ${plan.clipL?'clip-l':''} ${plan.clipR?'clip-r':''}" title="계획 ${a.planStart} ~ ${a.planEnd}${plan.clipL?' (표시 기간 이전 시작)':''}${plan.clipR?' (표시 기간 이후 종료)':''}"
                   style="left:${plan.left}%;width:${plan.width}%"><b>월간계획 ${dstr(a.planStart)}~${dstr(a.planEnd)}</b></div>
              <div class="gt-actbg" style="left:${plan.left}%;width:${plan.width}%"></div>
              ${rate==null
                ? `<div class="gt-none" style="left:${plan.left}%">미착수</div>`
                : `<div class="gt-act ${cls} ${plan.clipL?'clip-l':''}" title="공정율 ${rate}% · W/O ${woDone}/${a.woCount} 완료"
                     style="left:${plan.left}%;width:${actW}%"><b class="${actW>=16?'bin':''}">실적 ${rate}%</b></div>`}
              ${ext ? `<div class="gt-ext" title="완료예정일 ${extEnd} 재지정${a.delayReason?' · '+esc(a.delayReason):''}"
                     style="left:${ext.left}%;width:${ext.width}%"><b>~${dstr(extEnd)}</b></div>` : ''}
              ${ost!=='done' && pr>0 && pr<100 ? `<div class="gt-ptick" title="오늘 계획 기준 ${pr}% 지점"
                     style="left:${(plan.left + plan.width*pr/100).toFixed(2)}%"></div>` : ''}
              ${todayIn?`<div class="gt-today" style="left:${pos(TODAY)}%"></div>`:''}
            </div>
            <div class="gt-right">
              ${rate==null ? '<span class="p none">—</span>'  /* .gt-right .p.none 이 동일 규격 */
                           : `<span class="p">${rate}<span style="font-size:12px">%</span></span>`}
              ${rate!=null ? `<small class="${gap<0?'dn':(gap>0?'up':'eq')}">계획 ${pr}% · ${
                    gap>0?`▲ ${gap}` : gap<0?`▼ ${-gap}` : '± 0'}%p</small>` : ''}
              ${late ? `<small class="dn">지연 D+${lateDays(a)}</small>` : ''}
            </div>
          </div>`;
        }).join('')}
        </div>
      </div>`
      : emptyHTML('표시할 액티비티가 없습니다','지정 기간·요약 카드 필터 또는 검색 조건을 변경해 주세요.')}
    </div>
  </div>`;
}

/* ============================================================
   화면 : 지연현황 (SCR-400)
   ============================================================ */
function viewDelay(){
  const all = lateList();
  const risk = riskList();
  let list = S.dquick==='risk' ? risk : all;     // 위험 칩은 지연이 아닌 '표준 소요일 초과' 건 (V82)
  if(S.hull!=='all')  list = list.filter(a=>a.hull===S.hull);
  if(S.block!=='all') list = list.filter(a=>a.block===S.block);
  if(S.company!=='all' && !isWorker()) list = list.filter(a=>a.company===S.company);
  const k = S.keyword.trim().toLowerCase();
  if(k) list = list.filter(a=>[a.id,a.hull,a.block,blkLabel(a),a.grp,a.company,a.stage,stageOf(a)].join(' ').toLowerCase().includes(k));
  if(S.dquick==='noend')      list = list.filter(a=>!a.expEnd);
  if(S.dquick==='reassigned') list = list.filter(a=>!!a.expEnd);

  const quick = [['all','전체', all.length],
                 ['noend','완료예정일 미지정', all.filter(a=>!a.expEnd).length],
                 ['reassigned','재지정됨', all.filter(a=>!!a.expEnd).length],
                 ['risk','지연 위험', scopeActs().some(a=>!isClosed(a)&&stdLimit(a)!=null)?risk.length:'미판정']];

  return `
  <div class="quickbar" style="margin-bottom:12px;border:0;padding:0;">
    ${quick.map(([kk,t,c])=>`<button class="chip ${S.dquick===kk?'on':''}" data-dquick="${kk}">${t}<span class="n">${c}</span></button>`).join('')}
  </div>
  <div class="card" style="height:calc(100% - 52px);">
    <div class="card-h"><h3>지연 대상 액티비티</h3><span class="sp" style="flex:1"></span>
      <span class="note" style="margin-right:10px">${S.dquick==='risk'
        ? '정확한 표준 매핑 수신분만 판정 · 미매핑/음수 버퍼는 판정 제외'
        : '지연일수 내림차순 · 완료예정일 미지정 우선'}</span>
      <button class="btn sm" data-act="export"><i class="bi bi-download"></i> 엑셀</button></div>
    <div class="card-b" style="padding:0;overflow:auto;">
      ${list.length ? `<table class="tbl">
        <thead><tr>
          <th style="width:150px">호선-블록</th><th style="width:80px">공종</th><th style="width:78px">공정</th>
          ${isWorker()?'':'<th style="width:74px">협력사</th>'}
          <th style="width:70px">계획작업량</th><th style="width:112px">월간계획완료일</th><th style="width:112px">완료예정일</th>
          <th style="width:62px">차이</th>
          <th style="width:112px">지연사유 및 대책</th><th style="width:70px">공정율</th><th style="width:86px">상태</th><th style="width:60px"></th>
        </tr></thead>
        <tbody>${list.map(a=>{
          const st = statusOf(a,'intake');
          return `<tr>
            <td><b>${blkLabel(a)}</b><br><span class="tsub">${a.shop} · ${a.id}</span></td>
            <td>${a.grp}</td>
            <td><span class="tag t-gray" title="작업설명 : ${esc(a.stage)}">${stageOf(a)}</span></td>
            ${isWorker()?'':`<td>${esc(a.company)}</td>`}
            <td>${numStr(a.qty)}</td>
            <td>${a.planEnd}</td>
            <td>${a.expEnd ? a.expEnd : (isLate(a) ? '<span class="tag t-late">미지정</span>' : '<span style="color:var(--c-ink-3)">-</span>')}</td>
            <td style="color:var(--st-late);font-weight:800">${isLate(a) ? `D+${lateDays(a)}` : `<span style="color:var(--st-risk)" title="표준 소요 ${stdLimit(a)}일 초과">표준 +${riskDays(a)}</span>`}</td>
            <td class="wrap">${a.delayReason ? esc(a.delayReason) : '<span style="color:var(--c-ink-3)">미등록</span>'}</td>
            <td>${apprRate(a)==null ? '<span class="pct none" style="font-size:13.5px">—</span>' : apprRate(a)+'%'}</td>
            <td><span class="tag ${ST_CLS[confirmState(a).st]}">${confirmState(a).t}</span></td>
            <td><button class="btn sm" data-open="${a.id}">상세</button></td>
          </tr>`;}).join('')}</tbody></table>`
      : emptyHTML('지연 대상이 없습니다','조건에 해당하는 지연 액티비티가 없습니다.')}
    </div>
  </div>`;
}

function viewHTML(){
  if(S.view==='home')  return viewHome();
  if(S.view==='appr')  return viewAppr();
  if(S.view==='delay') return viewDelay();
  if(S.view==='sched') return viewSched();
  return viewReg();
}

/* ============================================================
   이벤트 바인딩
   ============================================================ */
function bindCommon(){
  document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{ go(el.dataset.go); });
  const kw = $('#kw');
  if(kw){
    kw.oninput = e=>{ S.keyword = e.target.value; softRerender(); };
    kw.onkeydown = e=>{ if(e.key==='Escape'){ S.keyword=''; render(); } };
  }
  document.querySelectorAll('[data-act]').forEach(el=>{
    el.onclick = ()=>doAct(el.dataset.act, el);
  });
  const fh=$('#f-hull'), fb=$('#f-block'), fc=$('#f-comp');
  if(fh) fh.onchange = e=>{ S.hull = (e.target.selectedIndex===0)?'all':e.target.value; S.block='all'; render(); };
  if(fb) fb.onchange = e=>{ S.block = (e.target.selectedIndex===0)?'all':e.target.value; render(); };
  if(fc) fc.onchange = e=>{ S.company = (e.target.selectedIndex===0)?'all':e.target.value; render(); };
  const fs = $('#f-stage');
  if(fs) fs.onchange = e=>{ S.stage = e.target.value; render(); };
  bindBodyControls();
  /* 날짜 변경은 목록만 soft 갱신 — 팝오버·캘린더·포커스를 유지한다 */
  const drApply = ()=>{
    const d = S.dRange;
    if(d.from && d.to && d.from > d.to){
      [d.from, d.to] = [d.to, d.from];
      const f2=$('#f-from'), t2=$('#f-to'); if(f2) f2.value=d.from; if(t2) t2.value=d.to;
      toast('시작일이 종료일보다 늦어 순서를 맞바꿨습니다.','warn');
    }
    softRerender();
    const btn = document.querySelector('.fb-date-btn');
    if(btn){
      btn.innerHTML = `<i class="bi bi-calendar-range"></i>${drLabel()}`;
      btn.classList.toggle('on', !!(d.from || d.to));
    }
    const clr = document.querySelector('[data-act="drclear"]');
    if(clr) clr.disabled = !(d.from || d.to);
  };
  const fb1 = $('#f-basis'); if(fb1) fb1.onchange = ()=>{ S.dRange.basis = fb1.value; drApply(); };
  const ff = $('#f-from'); if(ff) ff.onchange = ()=>{ S.dRange.from = ff.value; drApply(); };
  const ft = $('#f-to');   if(ft) ft.onchange = ()=>{ S.dRange.to = ft.value; drApply(); };
  positionDrPop();
}

/* 본문(#viewbody) 안에 있는 공통 컨트롤 — 전체 render 와 softRerender 양쪽에서 묶는다 (V80).
   검색어를 치면 본문만 다시 그리는데, 이때 정렬·간트 컨트롤의 핸들러가 끊기던 문제. */
function bindBodyControls(){
  document.querySelectorAll('[data-grp]').forEach(el=>el.onclick=()=>{
    S.grp=el.dataset.grp; S.stage='all'; render(); });
  document.querySelectorAll('[data-range]').forEach(el=>el.onclick=()=>{
    S.schedRange = el.dataset.range;
    if(S.dRange.from || S.dRange.to){ S.dRange.from=''; S.dRange.to=''; toast('지정 기간을 해제하고 프리셋 범위로 표시합니다.','warn'); }
    render(); });
  document.querySelectorAll('[data-schedfilt]').forEach(el=>el.onclick=()=>{
    S.schedFilt = (S.schedFilt===el.dataset.schedfilt || el.dataset.schedfilt==='all') ? 'all' : el.dataset.schedfilt; render(); });
  const gsort = $('#gt-sort'); if(gsort) gsort.onchange = ()=>{ S.schedSort = gsort.value; render(); };
  const rsort = $('#reg-sort'); if(rsort) rsort.onchange = ()=>{ S.regSort = rsort.value; render(); };
  document.querySelectorAll('[data-aview]').forEach(el=>el.onclick=()=>{
    S.apprView = el.dataset.aview; S.checked = []; render(); });
}
function softRerender(){
  const body = $('#viewbody');
  if(!body) return render();
  const active = document.activeElement, id = active?.id, pos = active?.selectionStart;
  body.innerHTML = viewHTML();
  bindView();
  bindBodyControls();
  fitScroll();
  document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go));
  document.querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>doAct(el.dataset.act, el));
  if(id==='kw'){ const k=$('#kw'); if(k){ k.focus(); try{k.setSelectionRange(pos,pos);}catch(e){} } }
}

/* 간트 라벨 충돌 해소 — 실적 라벨('실적 n%' 또는 '미착수')과 연장 라벨('~MM/DD')이 같은 자리에 찍히면
   연장 라벨을 바 안쪽 오른쪽 → 바 바깥 오른쪽 순으로 옮기고, 그래도 겹치면 숨긴다 (V88).
   퍼센트 계산으로는 글자 폭을 알 수 없어 그린 뒤 실제 좌표로 판단한다. */
function layoutGantt(){
  const hit = (a,b)=> a.width && b.width && a.left < b.right+4 && b.left < a.right+4 && a.top < b.bottom && b.top < a.bottom;
  document.querySelectorAll('.gt-track').forEach(tr=>{
    const ex = tr.querySelector('.gt-ext'); const el = ex && ex.querySelector('b'); if(!el) return;
    const al = tr.querySelector('.gt-act b:not(.bin), .gt-none');
    const R = e => e.getBoundingClientRect();
    /* '미착수' 글자가 연장 바에 덮이면 (계획 바가 표시 기간 앞에서 통째로 잘린 경우) 바 위에 흰 글자로 */
    const nn = tr.querySelector('.gt-none');
    if(nn){ nn.classList.toggle('in', hit(R(nn), R(ex))); }
    el.className = '';
    if(!al || !hit(R(al), R(el))) return;
    const cands = R(ex).width >= R(el).width + 14 ? ['in','out'] : ['out'];
    for(const c of cands){ el.className = c; if(!hit(R(al), R(el))) return; }
    el.className = 'hide';
  });
}
window.addEventListener('resize', ()=>{ if(S.user && S.view==='sched') layoutGantt(); });

function bindView(){
  if(S.view==='sched') layoutGantt();
  document.querySelectorAll('[data-row]').forEach(el=>el.onclick=e=>{
    if(e.target.closest('[data-check]')) return;
    // 홈 등 목록 화면 밖에서 누른 경우 실적등록/실적확인으로 이동한 뒤 해당 건을 연다
    if(S.view!=='reg' && S.view!=='appr'){ S.view='reg'; S.regMode='intake'; S.quick='all'; }
    selectAct(el.dataset.row);
  });
  document.querySelectorAll('[data-arow]').forEach(el=>el.onclick=e=>{
    if(e.target.closest('[data-check]')) return;
    const [id, mode] = el.dataset.arow.split('|');
    /* 다른 건으로 옮길 때 입력 중이던 값이 있으면 먼저 묻는다 (V80 — 이 경로는 selectAct 를 거치지 않았다) */
    const open = ()=>{ S.selectedId = id; S.tab = mode; render(); };
    if(S.draft && S.draft.id!==id){ confirmDiscard(open); return; }
    open();
  });
  document.querySelectorAll('[data-ares]').forEach(el=>el.onclick=()=>{
    S.apprRes = el.dataset.ares; render(); });
  document.querySelectorAll('[data-check]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const id = el.dataset.check;
    S.checked = S.checked.includes(id) ? S.checked.filter(x=>x!==id) : [...S.checked, id];
    render();
  });
  document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{ S.view='reg'; S.regMode='intake'; selectAct(el.dataset.open); });
  document.querySelectorAll('[data-quick]').forEach(el=>el.onclick=()=>{ S.quick=el.dataset.quick; render(); });
  document.querySelectorAll('[data-hkind]').forEach(el=>el.onclick=()=>{ S.histKind=el.dataset.hkind; render(); });
  document.querySelectorAll('[data-dquick]').forEach(el=>el.onclick=()=>{ S.dquick=el.dataset.dquick; render(); });
  document.querySelectorAll('[data-notif]').forEach(el=>el.onclick=()=>{ S.notiFilter=el.dataset.notif; render(); });
  document.querySelectorAll('[data-kpi]').forEach(el=>el.onclick=()=>{
    S.view='reg'; S.regMode='intake'; S.tab='intake'; S.quick=el.dataset.kpi;
    render();
  });
  document.querySelectorAll('[data-noti]').forEach(el=>el.onclick=()=>openNoti(el.dataset.noti));
  document.querySelectorAll('[data-wo]').forEach(el=>el.onclick=()=>toggleWO(+el.dataset.wo));
  document.querySelectorAll('[data-step]').forEach(el=>el.onclick=()=>stepRate(+el.dataset.step));
  document.querySelectorAll('[data-setrate]').forEach(el=>el.onclick=()=>setRate(+el.dataset.setrate, false));
  document.querySelectorAll('[data-stagesel]').forEach(el=>el.onclick=()=>{ S.adminStage=el.dataset.stagesel; render(); });
  const tk = $('#rate-track');
  if(tk && tk.classList.contains('tk-live')){
    const preview = e=>{
      const r = tk.getBoundingClientRect();
      let v = Math.round((e.clientX - r.left) / r.width * 100);
      v = Math.max(0, Math.min(100, v));
      const fl = rateFloor(); if(v < fl) v = fl;
      tk.querySelector('.cur').style.width = v + '%';
      const th = tk.querySelector('.thumb'); if(th) th.style.left = v + '%';
      const inp = $('#rateinput'); if(inp) inp.value = v;
      const vv = tk.closest('.line').querySelector('.v'); if(vv) vv.textContent = v + '%';
      return v;
    };
    tk.onpointerdown = e=>{ e.preventDefault(); tk.setPointerCapture(e.pointerId); tk._drag = true; preview(e); };
    tk.onpointermove = e=>{ if(tk._drag) preview(e); };
    tk.onpointerup = e=>{ if(!tk._drag) return; tk._drag = false; setRate(preview(e)); };
    tk.onpointercancel = ()=>{ tk._drag = false; render(); };
  }
  const ri = $('#rateinput');
  if(ri){ ri.oninput = ()=>{ let v = parseInt(ri.value||'0',10); if(isNaN(v)) v=0; v=Math.max(0,Math.min(100,v)); setRate(v, true); };
          ri.onchange = ()=>{ let v = parseInt(ri.value||'0',10); if(isNaN(v)) v=0; setRate(Math.max(0,Math.min(100,v))); }; }   // 입력 종료 → W/O·표시 갱신 (V80)
  const ee = $('#expend'); if(ee) ee.onchange = ()=>{ ensureDraft(); S.draft.expEnd = ee.value; render(); };
  const dr = $('#dreason'); if(dr) dr.onchange = ()=>{ ensureDraft(); S.draft.reason = dr.value; render(); };
  fitScroll();                          // 넘치는 한 장짜리 화면은 본문을 스크롤 가능하게 (V98)
}

function go(v){
  if(v==='delay')v='home'; // 지연현황 메뉴 보류
  if(S.draft){ confirmDiscard(()=>go(v)); return; }
  if(isWorker() && !['reg','sched','home'].includes(v)) v = 'reg';   /* 작업자 : 실적등록·계획일정 + 벨의 알림 화면 (V79·V86) */
  S.view = v; S.keyword=''; S.draft=null; S.sfpoOpen=false; S.drOpen=false;
  // 작업자는 '지금 입력해야 할 것'부터 본다 (승인자가 승인함으로 진입하는 것과 대칭)
  if(v==='reg'){ S.tab = S.regMode; if(isWorker()) S.quick = 'todo'; }
  render();
}
/* 초안 폐기 확인 — 브라우저 confirm 은 태블릿·장갑에서 누르기 어렵다 → 앱 모달 (V79)
   then() 은 사용자가 '이동'을 눌렀을 때만 실행된다. */
function confirmDiscard(then, title, msg, okLabel){
  if(!S.draft){ then(); return; }
  const bd = $('#backdrop');
  bd.innerHTML = `<div class="modal">
    <div class="modal-h"><h3>${title || '저장하지 않은 입력값'}</h3>
      <p>${msg || '지금 이동하면 입력 중이던 값이 사라집니다.'}</p></div>
    <div class="modal-f"><button class="btn" id="dc-stay">계속 입력</button>
      <button class="btn ok" id="dc-go"><i class="bi bi-box-arrow-right"></i>${okLabel || '저장 안 하고 이동'}</button></div></div>`;
  bd.classList.add('on');
  $('#dc-stay').onclick = ()=> bd.classList.remove('on');
  bd.onclick = e=>{ if(e.target===bd) bd.classList.remove('on'); };
  $('#dc-go').onclick = ()=>{ bd.classList.remove('on'); S.draft=null; then(); };
}

function selectAct(id){
  if(S.draft && S.draft.id!==id){ confirmDiscard(()=>selectAct(id)); return; }
  /* 조회 범위 밖은 선택할 수 없다 — 목록에 없더라도 직접 지정되는 경로를 막는다 (V73) */
  if(!scopeActs().some(x=>x.id===id)){ toast('조회 권한이 없는 액티비티입니다.','no'); return; }
  S.selectedId = id;
  S.tab = S.regMode;
  render();
  revealRow(document.querySelector(`[data-row="${id}"]`)
         || document.querySelector(`[data-arow^="${id}|"]`));
  // 편집 가능한 건은 주 입력(워크오더)을 바로 눌 수 있도록 상세를 그 위치로 맞춘다
  const wo = document.querySelector('.wo-steps:not([disabled])');
  const body = document.querySelector('.insp-body');
  if(wo && body && wo.getBoundingClientRect().bottom > body.getBoundingClientRect().bottom){
    /* 상세 영역 안에서만 움직인다 — scrollIntoView 는 바깥 목록까지 끌고 간다 (V75) */
    body.scrollTop += wo.getBoundingClientRect().bottom - body.getBoundingClientRect().bottom + 8;
  }
}

function openNoti(nid){
  const n = DB.notis.find(x=>x.id===nid);
  if(!n) return;
  n.read = true;
  const a = actById(n.act);
  if(!a){ toast('해당 항목을 조회할 수 없습니다.','no'); render(); return; }
  if(isWorker() && a.company!==S.user.company){ toast('조회 권한이 없는 항목입니다.','no'); render(); return; }
  const open = ()=>{ S.view='reg'; S.regMode='intake'; S.tab='intake'; S.selectedId=a.id; S.quick='all'; S.keyword=''; render(); };
  if(S.draft && S.draft.id!==a.id){ confirmDiscard(open); return; }   /* 알림으로 옮길 때도 초안을 지킨다 (V80) */
  open();
}

/* ---------- 입력 : W/O · 공정율 ---------- */
function ensureDraft(){
  const a = actById(S.selectedId);
  const mode = S.tab==='outtake'?'outtake':'intake';
  if(!S.draft || S.draft.id!==a.id || S.draft.mode!==mode){
    S.draft = { id:a.id, mode,
      rate: baseRate(a, mode),
      wo: a.intake.wo.map(w=>({...w})),
      delayed: a.delayed, expEnd: a.expEnd, reason: a.delayReason };
  }
  return S.draft;
}
function toggleWO(idx){
  const d = ensureDraft();
  const willDone = !d.wo[idx].done;
  if(willDone){ for(let i=0;i<=idx;i++){ d.wo[i].done = true; d.wo[i].part = 0; } }
  else { for(let i=idx;i<d.wo.length;i++){ d.wo[i].done = false; d.wo[i].part = 0; } }
  const r = woRate(d.wo), fl = rateFloor();
  if(r < fl){
    /* 승인된 공정율 아래로는 내릴 수 없다 — W/O 해제 경로도 같은 규칙 (V80) */
    applyRateToWO(d.wo, d.rate);
    toast(`이미 승인된 공정율(${fl}%) 아래로는 내릴 수 없습니다.`,'warn');
    render(); return;
  }
  d.rate = r;
  render();
}
/* 공정율을 직접 입력(슬라이더·스테퍼·퀵버튼)해도 W/O 완료 구성이 그 값을 따라오게 한다 (V76).
   그러지 않으면 한 화면에 '워크오더 0/3 완료 · 공정율 0%' 와 입력값 90% 가 같이 뜬다. */
function applyRateToWO(wo, rate){
  let acc = 0, stop = false;
  wo.forEach(w=>{
    const done = !stop && rate != null && acc + w.weight <= rate;
    if(done){ acc += w.weight; w.done = true; w.part = 0; }
    else { stop = true; w.done = false; w.part = 0; }
  });
  if(rate != null && rate > acc){
    const cur = wo.find(w=>!w.done);
    /* 정수로 반올림하면 비중을 되곱했을 때 공정율이 ±0.3%p 어긋난다 (V90).
       0.1% 단위로 남겨 승인값 → W/O → 공정율 왕복이 일치하게 한다. */
    if(cur) cur.part = Math.max(0, Math.min(99.9, Math.round((rate - acc) / cur.weight * 1000) / 10));
  }
  return wo;
}
function rateFloor(){
  /* 이미 승인된 공정율 밑으로는 내릴 수 없다 (V61 — 승인은 확정 결재) */
  const a = actById(S.selectedId);
  if(!a) return 0;
  const p = perf(a, 'intake');
  return p.status==='done' ? (p.prevRate ?? p.rate ?? 0) : 0;
}
function stepRate(delta){
  const d = ensureDraft();
  setRate(Math.max(0, Math.min(100, d.rate + delta)));
}
function setRate(v, keepFocus){
  const d = ensureDraft();
  const fl = rateFloor();
  if(v < fl){
    v = fl;
    toast(`이미 승인된 공정율(${fl}%) 미만으로는 입력할 수 없습니다.`,'warn');
  }
  d.rate = v;
  applyRateToWO(d.wo, v);          // 입력값에 맞춰 W/O 완료 구성 재계산 (V76)
  if(keepFocus){
    // 입력 중에는 전체 렌더 대신 표시만 갱신
    const cur = document.querySelector('.rate-cmp .line.cl i.cur');
    if(cur) cur.style.width = v+'%';
    const vv = document.querySelector('.rate-cmp .line.cl .v');
    if(vv) vv.textContent = v+'%';
    const req = document.querySelector('[data-act="request"]');
    if(req){ const aa = actById(S.selectedId); const pp = aa && perf(aa,'intake');
      req.disabled = (pp && pp.status==='done') ? !(v > (pp.prevRate ?? pp.rate ?? 0)) : !(v>0); }
    const rev = document.querySelector('[data-act="revert"]');
    if(rev) rev.disabled = false;
    const sv = document.querySelector('[data-act="save"]');
    if(sv) sv.disabled = false;          // 입력 중에도 임시저장 가능 (V80)
  } else render();
}

/* ---------- 액션 ---------- */
function doAct(act, el){
  const a = actById(S.selectedId);
  const mode = S.tab==='outtake'?'outtake':'intake';
  switch(act){
    case 'clearkw': S.keyword=''; render(); break;
    case 'gonoti':
      if(S.view!=='home'){ S.view='home'; render(); }
      if(!isWorker()) toast(`미읽음 알림 ${unread()}건 — 홈 '최근 알림'에서 확인하세요.`);
      break;
    case 'readall': myNotis().forEach(n=>n.read=true); render(); break;
    case 'toggledr': S.drOpen = !S.drOpen; render(); break;
    case 'drclear': S.dRange.from=''; S.dRange.to=''; S.drOpen=true; render(); break;
    case 'exportreg': openExport('reg'); break;
    case 'export': openExport('delay'); break;
    case 'toggleref': S.refOpen = !S.refOpen; render(); break;
    case 'togglesfpo': S.sfpoOpen = !S.sfpoOpen; render(); break;
    case 'sfposync': {
      if(SFPO.hist[0] && SFPO.hist[0].st==='처리 중'){ toast('이미 동기화 요청이 처리 중입니다.','warn'); break; }
      SFPO.hist.unshift({at:T(0,'14:20'), mode:`수동 · ${S.user?S.user.name.split(' ')[0]:''}`,
                         total:null, added:null, changed:null, st:'처리 중'});
      toast('ERP 액티비티 동기화를 요청했습니다. 수신이 끝나면 알림으로 안내됩니다.','ok');
      render(); break;
    }
    case 'togglehist': S.histOpen = !S.histOpen; render(); break;
    case 'toggledelay': {
      const d = ensureDraft();
      d.delayed = !d.delayed;
      if(!d.delayed){ d.expEnd=null; d.reason=''; }
      render(); break;
    }
    case 'revert': confirmDiscard(()=>{ render(); toast('마지막 저장 값으로 되돌렸습니다.'); }, '입력값 초기화',
                     '지금까지 입력한 값을 버리고 마지막 저장 값으로 되돌립니다.', '초기화'); break;
    case 'save': saveperf(false); break;
    case 'request': saveperf(true); break;
    case 'closeinsp': confirmDiscard(()=>{ S.selectedId = null; render(); }); break;
    case 'approve': approve(a, mode); break;
    case 'apprall': apprToggleAll(); break;
    case 'bulkapprove': bulkApprove(); break;
    case 'bulkreject': openBulkReject(); break;
    case 'unapprove': unapprove(a, mode); break;
    case 'cancelreq': cancelRequest(a, mode); break;
    case 'reject': openReject(a, mode); break;
    case 'savestage': toast('기준정보를 저장했습니다. (프로토타입)','ok'); break;
  }
}

function validateDraft(d, a){
  if(typeof d.rate!=='number' || !isFinite(d.rate) || d.rate<0 || d.rate>100){
    toast('0부터 100 사이의 공정율을 입력해 주세요.','no'); return false; }
  d.rate = Math.round(d.rate);
  const fl = rateFloor();
  if(d.rate < fl){ toast(`이미 승인된 공정율(${fl}%) 아래로는 저장할 수 없습니다.`,'no'); return false; }
  if(d.delayed && !d.expEnd){ toast('지연으로 표시하려면 완료예정일을 입력해 주세요.','no'); return false; }
  if(d.delayed && d.expEnd && new Date(d.expEnd) < new Date(a.planStart)){
    toast('완료예정일은 월간계획착수일 이후여야 합니다.','no'); return false; }
  if(d.delayed && !d.reason){ toast('지연 사유를 선택해 주세요.','no'); return false; }
  return true;
}

function saveperf(request){
  const a = actById(S.selectedId);
  if(!a) return;
  const mode = S.tab==='outtake'?'outtake':'intake';
  /* 상태 가드 — 화면이 버튼을 감추더라도 함수 단에서 한 번 더 막는다 (V80) */
  if(isClosed(a)){ toast('종결된 액티비티는 수정할 수 없습니다.','no'); return; }
  if(statusOf(a, mode)==='wait'){ toast('승인대기 중입니다 — 수정하려면 요청을 먼저 취소해 주세요.','no'); return; }
  if(mode==='outtake'){ toast('완료 실적은 공정율 100% 승인 시 자동 기록됩니다.','no'); return; }
  const d = S.draft || ensureDraft();
  if(!validateDraft(d, a)) return;

  /* 승인요청 가능 여부는 '저장 전에' 판정한다 — 요청이 차단되는데
     실적만 몰래 저장·기록되면 사용자가 인지하지 못한 상태 변경이 생긴다. */
  if(request){
    if(d.rate<=0){ toast('공정율을 입력한 후 승인요청해 주세요.','no'); return; }
    const pv = perf(a, mode);
    if(pv.status==='done'){
      const ap = pv.prevRate ?? pv.rate ?? 0;
      if(d.rate<=ap){ toast(`이미 ${ap}%가 승인되었습니다. 그보다 높은 공정율을 입력해 주세요.`,'no'); return; }
    }
    if(isLate(a) && !d.expEnd){
      d.delayed = true;                      // 지연 처리를 열어 바로 입력하게 유도
      render();
      toast('월간계획완료일이 경과했습니다. 완료예정일을 재지정한 후 승인요청해 주세요.','no');
      return;
    }
  }

  const p = perf(a, mode);
  const before = p.rate;
  p.rate = d.rate;
  if(mode==='intake') a.intake.wo = d.wo.map(w=>({...w}));

  const dueChanged = (a.expEnd||null) !== (d.expEnd||null) || a.delayed !== d.delayed;
  a.delayed = d.delayed; a.expEnd = d.expEnd; a.delayReason = d.reason;

  // 이번에 완료 처리된 워크오더를 함께 남겨 무엇을 근거로 올린 값인지 추적 가능하게 한다
  const woNames = (mode==='intake' ? (d.wo||[]) : []).filter(w=>w.done).map(w=>w.name);
  log(a, '저장', `공정율 ${before==null?'미입력':before+'%'} → ${d.rate}%${
    woNames.length?` · 완료 워크오더 ${woNames.join(' · ')}`:''}`, mode);
  if(dueChanged){
    log(a, '지연', d.delayed? `완료예정일 ${d.expEnd} 재지정 (사유 : ${d.reason})` : '지연 표시 해제', mode);
    pushNoti({act:a.id, type:'duedate', to:'생산관리팀', role:'manager',
      desc: d.delayed? `완료예정일을 재지정했습니다. (${d.expEnd} · 사유 : ${d.reason})` : '완료예정일 재지정이 해제되었습니다.'});
  }

  if(request){
    if(p.status === 'done') p.docPrev = p.docNo;   // 이번 요청이 대체하는 직전 승인 문서 (V73)
    p.status = 'wait';
    p.requestedAt = nowStamp();
    p.requestedBy = S.user.name;
    p.docNo = nextDocNo(p.requestedAt);       // 요청 1건 = 결재 문서 1건 (V64)
    log(a, '승인요청', `[${p.docNo}] 공정율 ${d.rate}% 승인 요청 (작업조직 확정)${
        d.rate>=100 ? ' — 승인 시 종결' : ''}`, mode);
    pushNoti({act:a.id, type:'request', to:'생산관리팀', role:'manager', doc:p.docNo,
      desc:`실적 승인 요청이 접수되었습니다. (${a.company} · 공정율 ${d.rate}%)${
        d.rate>=100 ? ' — 승인 시 종결' : ''}`});
    toast(d.rate>=100
        ? `${a.id} 승인요청을 등록했습니다. 승인되면 액티비티가 종결됩니다.`
        : `${a.id} 승인요청을 등록했습니다.`,'ok');
  } else {
    toast(`${a.id} 실적을 임시저장했습니다.`,'ok');
  }
  S.draft = null;

  if(request){
    // 다음 미처리 건 자동 선택
    const list = filteredActs(mode);
    const next = list.find(x=>x.id!==a.id && ['none','rej'].includes(statusOf(x,mode)));
    S.selectedId = next? next.id : null;
    if(next) toast(`다음 미처리 항목(${next.id})을 선택했습니다.`);
  }
  render();
}

/* 전체 선택 : 현재 표시 중인 요청만 대상으로 한다 (필터 밖 건이 딸려가지 않게) */
function apprToggleAll(){
  const keys = apprRows().map(r=>r.key);
  const all = keys.length && keys.every(k=>S.checked.includes(k));
  S.checked = all ? [] : keys;
  render();
}

/* 요청 취소 : 관리조직 승인 전까지 작업자가 자신의 요청을 회수한다.
   등록값은 그대로 두고 상태만 되돌려, 수정 후 다시 요청할 수 있게 한다. */
function cancelRequest(a, mode){
  const p = perf(a, mode);
  if(statusOf(a, mode) !== 'wait'){ toast('승인대기 상태에서만 취소할 수 있습니다.','warn'); return; }
  const doc = p.docNo, was = p.rate;
  /* 회수는 '요청 직전 상태'로 되돌리는 것이다 — 직전 승인이 있으면 승인완료로 복귀한다 (V73).
     이전에는 무조건 '미등록'으로 떨어져 승인 이력이 있는 건이 누락으로 집계되었다. */
  const back = p.prevRate != null;
  p.status = back ? 'done' : 'none';
  if(back){ p.rate = p.prevRate; p.docNo = p.docPrev || null; }
  else { p.docNo = null; }                    // 회수된 번호는 재사용하지 않는다 (V64)
  p.requestedAt = null;
  log(a, '요청취소', `[${doc||'-'}] 공정율 ${was}% 승인요청 회수 · 재입력 가능${
        back ? ` (확정 공정율 ${p.prevRate}%로 복귀)` : ''}`, mode, null, doc);
  pushNoti({act:a.id, type:'request', to:'생산관리팀', role:'manager', doc,
    desc:`${mode==='intake'?'착수':'완료'} 실적 승인 요청이 작업자에 의해 취소되었습니다. (번호 폐기)`});
  toast(`${a.id} 승인요청을 취소했습니다. 수정 후 다시 요청해 주세요.`,'warn');
  render();
}


/* 승인 확인 (V51·V61) : 공정율 100% 승인은 종결이므로 '취소 불가'를 경고한다 */
function approve(a, mode){
  const p = perf(a, mode);
  if(statusOf(a,mode)!=='wait'){ toast('이미 처리된 항목입니다.','warn'); return; }
  /* 확인은 비가역인 종결(공정율 100% 승인)에만 — 그 외 승인은 되돌릴 수 있어 즉시 처리 (V52·V61) */
  if(!(p.rate>=100)){ doApprove(a, mode); return; }
  const bd = $('#backdrop');
  bd.innerHTML = `<div class="modal">
    <div class="modal-h"><h3>승인 · 종결</h3>
      <p>${docChip(p.docNo)} ${a.id} · 공정율 <b>${p.rate}%</b>${p.requestedBy?` · 요청 ${esc(p.requestedBy)}`:''}</p></div>
    <div class="modal-b"><div class="ap-note warn"><i class="bi bi-lock-fill"></i><span>공정율 100%를 승인하면 이 액티비티는 <b>종결</b>됩니다. 종결 후에는 승인 취소·수정이 불가합니다.</span></div></div>
    <div class="modal-f"><button class="btn" id="ap-cancel">취소</button>
      <button class="btn ok" id="ap-ok"><i class="bi bi-check2-circle"></i>승인 · 종결</button></div></div>`;
  bd.classList.add('on');
  $('#ap-cancel').onclick = ()=> bd.classList.remove('on');
  bd.onclick = e=>{ if(e.target===bd) bd.classList.remove('on'); };
  $('#ap-ok').onclick = ()=>{ bd.classList.remove('on'); doApprove(a, mode); };
}
/* 공정율 100% 승인 = 액티비티 종결 (V61)
   완료 실적은 사용자가 다시 보고·승인하지 않고 이 시점에 자동 기록된다.
   (실적완료일·집계용 착수/완료 구분은 그대로 남는다) */
function autoClose(a, at, by){
  const o = a.outtake;
  if(o.status === 'done') return false;
  o.rate = 100; o.status = 'done'; o.prevRate = 100;
  o.approvedAt = at; o.approvedBy = by; o.requestedAt = at;

  o.docNo = perf(a,'intake').docNo;           // 종결은 별도 결재가 아니다 — 번호 승계 (V64)

function doApprove(a, mode){
  const p = perf(a, mode);
  if(statusOf(a,mode)!=='wait'){ toast('이미 처리된 항목입니다.','warn'); return; }
  const from = p.prevRate;
  p.status='done'; p.approvedAt = nowStamp(); p.approvedBy = S.user.name;
  p.perfDate = p.perfDate || TODAY;          // 실적일자(착수일/완료일) 확정
  p.prevRateBefore = from;                   // 승인 취소 시 되돌릴 값 (V79)
  p.prevRate = p.rate;                       // 다음 요청의 비교 기준
  log(a,'승인',`[${p.docNo||'-'}] 공정율 ${from==null?'':from+'% → '}${p.rate}% 승인 (관리조직)`, mode);
  const closed = mode==='intake' && p.rate>=100 && autoClose(a, p.approvedAt, p.approvedBy);
  pushNoti({act:a.id, type:'approved', to:a.company, role:'worker', doc:p.docNo,
    desc:closed ? `공정율 100%가 승인되어 액티비티가 종결되었습니다.`
                : `실적이 승인 처리되었습니다. (공정율 ${p.rate}%)`});
  toast(closed ? `${a.id} 승인 · 액티비티를 종결했습니다.` : `${a.id} 실적을 승인했습니다.`,'ok');
  S.checked = S.checked.filter(x=>x!==a.id);
  const list = filteredActs(mode);
  const next = list.find(x=>x.id!==a.id && statusOf(x,mode)==='wait');
  S.selectedId = next? next.id : null;
  render();
}

/* 승인 취소 : 승인 완료 건을 승인대기로 되돌려 재검토·반려가 가능하게 한다 */
function unapprove(a, mode){
  const p = perf(a, mode);
  if(p.status!=='done'){ toast('승인 완료 건만 취소할 수 있습니다.','warn'); return; }
  if(mode==='outtake'){
    toast('종결된 액티비티는 승인을 취소할 수 없습니다.','no'); return; }
  if(a.outtake.rate!=null){
    toast('종결된 액티비티는 승인을 취소할 수 없습니다.','no'); return; }
  p.status = 'wait';                          // 같은 결재 건으로 되돌린다 — 번호 유지 (V64)
  p.approvedAt = null; p.approvedBy = null;
  p.requestedAt = p.requestedAt || nowStamp();
  /* 확정 공정율도 승인 전으로 — 취소된 값이 조회 화면에 확정으로 남지 않게 (V79) */
  p.prevRate = ('prevRateBefore' in p) ? p.prevRateBefore : null;
  delete p.prevRateBefore;
  log(a,'승인취소',`공정율 ${p.rate}% 승인 취소 · 승인대기로 환원${p.prevRate!=null?` (확정 ${p.prevRate}%로 복귀)`:''}`, mode);
  pushNoti({act:a.id, type:'unapproved', to:a.company, role:'worker', doc:p.docNo,
    desc:`실적 승인이 취소되어 재검토 중입니다. (공정율 ${p.rate}%)`});
  toast(`${a.id} 승인을 취소했습니다.`,'warn');
  render();
}

/* 일괄 반려 모달 : 사유를 한 번만 입력해 선택 건 전체에 적용 */
/* ============================================================
   엑셀(.xlsx) 생성 엔진 (V51 — 외부 목업 이식) : 외부 라이브러리 없이
   ZIP(무압축) + SpreadsheetML 을 직접 조립해 실제 파일을 내려받는다.

const XLSX_NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
function xpColName(i){ let n=''; i++; while(i>0){ n=String.fromCharCode(65+(i-1)%26)+n; i=Math.floor((i-1)/26); } return n; }
function xpEsc(v){ return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function xpCrc32(bytes){ let crc=-1; for(let byte of bytes){ crc^=byte; for(let i=0;i<8;i++) crc=(crc>>>1)^(0xedb88320&-(crc&1)); } return (crc^-1)>>>0; }
function xpZip(files){

  function header(n){ const a=new Uint8Array(n); return [a, new DataView(a.buffer)]; }

    v.setUint32(0,0x04034b50,true); v.setUint16(4,20,true); v.setUint16(6,0x800,true);
    v.setUint32(14,crc,true); v.setUint32(18,data.length,true); v.setUint32(22,data.length,true);
    v.setUint16(26,name.length,true); chunks.push(h,name,data);

    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true); cv.setUint16(8,0x800,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,data.length,true); cv.setUint32(24,data.length,true);
    cv.setUint16(28,name.length,true); cv.setUint32(42,offset,true);
    central.push(c,name); offset+=30+name.length+data.length;
  }
  const centralLength=central.reduce((n,b)=>n+b.length,0), [end,ev]=header(22);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,Object.keys(files).length,true);
  ev.setUint16(10,Object.keys(files).length,true); ev.setUint32(12,centralLength,true); ev.setUint32(16,offset,true);

function xpSheetXML(rows,widths){

function xlsxBlob(sheets){

  files['xl/workbook.xml']=`<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="${XLSX_NS}" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((x,i)=>`<sheet name="${xpEsc(x.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`;

function downloadBlob(blob,name){

/* 다운로드 실행 — 현재 조회 조건 또는 전체를 시트로 조립한다 */
function runExport(kind, scope, modes, withHist, withLate){
  const isReg = kind==='reg';
  const modeList = isReg ? ['intake'] : null;   /* 완료는 자동 파생 — 종결 여부로 표기 (V61) */
  const acts = m => scope==='cur' ? filteredActs(m||'intake') : scopeActs();
  const pairs = [];
  if(isReg){
    modeList.forEach(m=>acts(m).forEach(a=>{
      if(m==='outtake' && !intakeComplete(a)) return;
      pairs.push({a, m});
    }));
  } else {
    lateList().forEach(a=>pairs.push({a, m:'intake'}));
  }
  const noneLb = m => '실적누락';
  /* 앞쪽은 ERP 수신 항목(WG212M 컬럼명 그대로), 뒤쪽은 본 시스템 생성 항목 (V69) */
  const head = ['실행계획Activity','공사번호','블록구획번호','작업설명',
                '공종코드','공종','주공정코드','주공정','작업단계코드','작업단계',
                '실행계획세부분류코드','공장코드','정반코드','계획작업량',
                '월간계획착수일','월간계획완료일','실제착수일','실제완료일','작업상태코드',
                '협력사','상태','확정 공정률(%)','신청 공정률(%)','결재 문서번호','승인 문서번호','완료예정일','W/O 완료',
                '요청일시','승인일시'];
  if(withLate) head.push('지연','지연 사유');
  const rows=[head];
  pairs.forEach(({a,m})=>{
    const p = perf(a,m), st = statusOf(a,m);
    const row=[a.id, a.hull, a.block, a.stage,
      a.gcode, flagName(a.gcode), a.gcode+a.hcode, mpName(a.gcode,a.hcode),
      a.icode?a.gcode+a.icode:'', stgeName(a.gcode,a.icode), a.kcode,
      a.shop, a.org||'', a.qty, a.planStart, a.planEnd, a.actStart||'', a.actEnd||'', a.vcode||'',
      a.company, st==='none'?noneLb(m):ST_LABEL[st], apprRate(a)??'', a.v88?.request?woRate(a.v88.request.wo):'', p.docNo||'', apprDoc(a)||'', a.expEnd||'',
      `${apprWO(a).filter(w=>w.done).length}/${a.intake.wo.length}`,
      p.requestedAt||'', p.approvedAt||''];
    if(withLate) row.push(isLate(a)?'지연':'', a.delayReason||'');
    rows.push(row);
  });
  const sheets=[{name:isReg?'실적 목록':'지연현황', rows,
    widths:head.map(h=>h.includes('문서')?24:h.includes('일시')||h.includes('실제')?21:h==='액티비티'?24:16)}];
  if(withHist){
    const hr=[['액티비티','결재 문서번호','이력시각','처리자','행위','내용']];
    pairs.forEach(({a,m})=>a.history.forEach(h=>hr.push([a.id, h.doc||'', h.at, h.by, h.kind,
      h.detail.replace(/^\[[^\]]+\]\s*/,'')])));
    sheets.push({name:'처리 이력', rows:hr, widths:[16,18,19,14,12,70]});
  }
  sheets.push({name:'조회 정보', rows:[['항목','내용'],
    ['문서 구분','프로토타입 예시 데이터 — 실제 생산정보 아님'],['기준일',TODAY],
    ['생성자',S.user.name],['출력 화면',isReg?'실적확인':'지연현황'],
    ['범위',scope==='cur'?'현재 조회 조건 (필터·검색·기간 적용)':'담당 범위 전체'],
    ['출력 건수',pairs.length],
    ['항목 출처','실행계획Activity~작업상태코드 : ERP 수신(WG212M) / 협력사 이후 : 본 시스템 생성']],
    widths:[16,80]});
  log0Export(kind, scope, pairs.length);
  downloadBlob(xlsxBlob(sheets), `디지털실적수집_${isReg?'실적목록':'지연현황'}_${TODAY.replaceAll('-','')}.xlsx`);
  return pairs.length;
}

function v88requestCompare(a){
  const x=v88init(a),q=x.request;if(!q)return '';

    const different=!old||was!==pct||old.start!==w.start||old.end!==w.end;
    const delta=old?Math.round((pct-was)*w.weight)/100:null;
    const row=`<tr class="${different?'changed':''}"><td title="${esc(w.code)}">${esc(w.name)}</td><td>${was===null?'—':was+'%'} → <b>${pct}%</b></td><td>${w.weight}%</td><td>${delta===null?'—':(delta>0?'+':'')+delta+'%p'}</td></tr>`;
    (different?changed:unchanged).push(row);
    if(old)for(const [key,label] of [['start','착수'],['end','완료']])if(old[key]!==w[key])extras.push(`<li>${esc(w.name)} ${label}: ${esc(old[key]||'없음')} → ${esc(w[key]||'없음')}</li>`);
  });

  return `<section class="v88-request-compare"><div class="v88-section-head"><h3>이번 신청 · ${q.kind==='auto'?'자동 실적 전송 승인':q.kind==='correction'?'실적 정정':'수동 실적'}</h3><b>${before?woRate(before)+'% → ':''}${woRate(q.wo)}%</b></div><small>신청 ${esc(q.by||'—')} · ${esc(q.at||'—')}</small>${changed.length?table(changed):'<div class="v88-compare-empty">W/O 진행률·일시 변경 없음</div>'}${extras.length?`<div class="v88-request-dates"><ul>${extras.join('')}</ul></div>`:''}${q.kind==='correction'?`<div class="v88-request-reason">정정 사유: ${esc(q.reason||'미기재')}</div>`:''}${unchanged.length?`<details class="v88-history-extra"><summary>변경 없는 작업 ${unchanged.length}건</summary>${table(unchanged)}</details>`:''}${!before?'<small>이전 수신값이 보관되지 않은 기존 신청입니다. 현재 전송 대상값을 표시합니다.</small>':''}</section>`;
}

   액티비티 한 건이 수신되면 어떤 W/O 로 쪼갤지 정해 주는 표준 구성이다.
   고르는 기준은 공종코드+작업단계코드의 명칭이며 현재는 대표 예시다. 운영 W/O 수신값과 구분한다. */
const TPL_NAME0 = {'*':'기본 (원천에 표준 구성 없음)'};
function tplCfg(){
  DB.v88weights ||= {version:1, templates:v88copy(WO_TPL)};
  DB.v88weights.names ||= {};
  Object.keys(DB.v88weights.templates).forEach(k=>{ DB.v88weights.names[k] ||= (TPL_NAME0[k] || k); });
  return DB.v88weights;
}
const tplSum = t => Math.round(t.reduce((n,w)=>n+Number(w.w||0),0)*10)/10;
/* 입력 가능한 작업단계 — 코드 사전(CD_STGE)에 있는 이름만 받는다 (V97) */
const STAGE_NAMES = [...new Set(Object.values(CD_STGE))];
/* 이 템플릿이 걸리는 액티비티 — 작업단계가 같은 건 (기본은 표준 구성이 없는 나머지) */
function tplActs(code){
  const keys = Object.keys(tplCfg().templates);
  return DB.acts.filter(a=>{ const k=stageOf(a);
    return code==='*' ? !keys.includes(k) : k===code; });
}
function v88weights(){
  if(!v88manager())return;
  if(S.view!=='weights'){S.view='weights';render();return;}

  const help = `<details class="tpl-help"><summary>공정 템플릿이란</summary>

    <b>W/O(작업지시)</b> 여러 개로 나눠야 합니다. 어떤 W/O 로 나눌지와 각 W/O 가 공정률에서 차지하는
    <b>비중</b>을 미리 정해 둔 표준 구성이 공정 템플릿입니다.<br>
    현재 목업은 <b>작업단계별 대표 예시</b>를 사용합니다. 같은 단계라도 블록별 구성이 다르므로 실제 수신 W/O와 구분합니다. 액티비티의 <b>작업단계</b>(공종코드 + 작업단계코드)로 대표 템플릿을 고릅니다. 예를 들어 작업단계가
    <code>대조</code> 인 액티비티는 <code>대조</code> 템플릿을 받아 취부·용접+사상·검사준비+NDE·검사
    네 개의 W/O 로 나뉘고, 표준 구성이 없는 작업단계는 <code>*</code> 기본 템플릿을 씁니다.<br>
    공정률은 <b>W/O별 진행률 × 비중의 합</b>이라서 비중 합계는 반드시 100% 여야 합니다.
    템플릿을 바꿔도 <b>이미 받아 둔 액티비티의 W/O 와 실적은 그대로</b> 두고, 이후 수신분부터 적용합니다.
    <br><small>출처 : 「표준호선블록에 따른 WO List_r0.2(260917)」 — 유효 Activity 523종 · W/O 1,402행 중
    비중 합계 100%인 520종에서 작업단계별 대표 구성을 뽑았습니다. W/O 코드는 원천의 세부분류코드이고,
    원천 작업지시번호를 우선 보존합니다. 화면의 조합 번호는 <b>목업 예시</b>이며, 운영 번호 생성 규칙은 연계 협의 대상입니다. 아래 원천 구성에서 블록별 차이와 비중 오류를 확인할 수 있습니다.</small></details>`;

  const rows = keys.map(k=>{
    const t=cfg.templates[k], sum=tplSum(t), n=tplActs(k).length;
    return `<tr class="${d&&d.orig===k?'on':''}">
      <td class="k">${esc(k)}</td>
      <td><b>${esc(cfg.names[k]||k)}</b>${d&&d.orig===k?'<span class="editing">수정 중</span>':''}</td>
      <td class="wo">${t.map(w=>esc(w.name)+' '+w.w+'%').join(' · ')}</td>
      <td class="sum ${Math.abs(sum-100)>0.001?'bad':''}">${sum}%</td>
      <td class="use ${n?'':'zero'}">${n?n+'건':'없음'}</td>
      <td class="act">
        <button class="btn sm" data-tpl-edit="${esc(k)}">수정</button>
        <button class="btn sm no" data-tpl-del="${esc(k)}" ${k==='*'?'disabled title="기본 템플릿은 지울 수 없습니다"':''}>삭제</button>

  const table = `<table class="tpl-tbl"><thead><tr>

    edit = `<div class="tpl-edit"><h3>${d.orig?`템플릿 수정 · ${esc(d.orig)}`:'새 공정 템플릿'}</h3>

        <input class="cd" style="width:64px" data-tpl-ser="${i}" value="${esc(w.ser||'')}" placeholder="W/O순번" aria-label="W/O순번" title="원천 순번. 표시 순서와 구분하여 보존합니다.">
        <input class="nm" data-tpl-nm="${i}" value="${esc(w.name||'')}" placeholder="작업명" aria-label="작업명">
        <input class="w" type="number" min="0" max="100" step="0.1" data-tpl-w="${i}" value="${w.w}" aria-label="비중"> %
        <button class="btn sm mv" data-tpl-up="${i}" ${i===0?'disabled':''} aria-label="위로">↑</button>
        <button class="btn sm mv" data-tpl-down="${i}" ${i===d.wo.length-1?'disabled':''} aria-label="아래로">↓</button>
        <button class="btn sm no mv" data-tpl-rm="${i}" ${d.wo.length<2?'disabled':''} aria-label="행 삭제">×</button>
      </div>`).join('')}</div>
      <div class="tpl-bar"><button class="btn sm" data-tpl-add="1">+ W/O 추가</button>
        <span class="sp"></span>
        <span class="tpl-sum ${Math.abs(sum-100)>0.001?'bad':''}">비중 합계 ${sum}% ${Math.abs(sum-100)>0.001?'· 100% 여야 저장됩니다':'· 저장 가능'}</span></div>
      <div class="tpl-bar"><button class="btn" data-tpl-cancel="1">취소</button>
        <button class="btn pri" data-tpl-save="1">${d.orig?'수정 저장':'템플릿 추가'}</button></div>
      <div class="tpl-use">이 템플릿이 걸리는 액티비티 <b>${use.length}건</b>${
        use.length?' · '+use.slice(0,6).map(a=>esc(a.id)+'('+esc(a.kcode)+')').join(', ')+(use.length>6?` 외 ${use.length-6}건`:''):' — 현재 시드에는 없습니다'}
        <br><small>기존 액티비티의 W/O 와 실적은 이 수정으로 바뀌지 않습니다. 이후 수신분부터 적용됩니다.</small></div>
    </div>`;
  }

  const foot = `<div class="tpl-use">설정 버전 <b>V${cfg.version}</b>${cfg.by?` · 최종 ${esc(cfg.by)} ${esc(cfg.at||'')}`:' · 참고 자료'}
    · 전체 액티비티 ${DB.acts.length}건 · 템플릿 ${keys.length}개</div>`;

  $('#v88-weights-page').innerHTML = `<section class="v88-weights-page tpl-wrap">${help}
    <div class="tpl-bar"><b>공정 템플릿 ${keys.length}개</b><span class="sp"></span>
      <button class="btn pri" data-tpl-new="1">+ 새 템플릿</button></div>
    ${edit}${table}${foot}</section>`;
  /* 이 화면은 본문을 다 그린 뒤에 내용을 채운다 — 채운 높이로 다시 판정하고,
     다시 그리기 전의 스크롤 위치를 되돌린다 (행 추가·이동·삭제 때 맨 위로 튀지 않게) (V98). */
  fitScroll();
  if(SCROLL_OK) restoreScroll();
  /* 편집 패널이 화면 밖(표 아래)에 그려져 '눌러도 반응이 없다' 고 보이던 문제 (V96) */
  if(S.tplScroll){ S.tplScroll=false;
    const el=$('#v88-weights-page').querySelector('.tpl-edit');
    if(el) el.scrollIntoView({block:'nearest'});
    const first=el&&el.querySelector('input'); if(first) first.focus({preventScroll:true});
  }

  /* ── 이벤트 */
  const draft = () => S.tplEdit;
  const save = () => { cfg.history ||= []; cfg.history.push({version:cfg.version, templates:v88copy(cfg.templates),
      names:v88copy(cfg.names), by:cfg.by||'참고 자료', at:cfg.at||v88now()});
    cfg.version++; cfg.by=S.user.name; cfg.at=v88now(); persist(); };

  document.querySelectorAll('[data-tpl-edit]').forEach(el=>el.onclick=()=>{
    const k=el.dataset.tplEdit;
    S.tplEdit={code:k, orig:k, name:cfg.names[k]||k, wo:v88copy(cfg.templates[k])}; S.tplScroll=true; render(); });
  document.querySelectorAll('[data-tpl-new]').forEach(el=>el.onclick=()=>{
    S.tplEdit={code:'', orig:null, name:'', wo:[{cd:'--',ser:'01',name:'준비',w:30},{cd:'--',ser:'02',name:'작업',w:50},{cd:'--',ser:'03',name:'검사',w:20}]};
    S.tplScroll=true; render(); });
  document.querySelectorAll('[data-tpl-del]').forEach(el=>el.onclick=()=>{
    const k=el.dataset.tplDel; if(k==='*')return;
    const n=tplActs(k).length;
    v88modal(`공정 템플릿 삭제 · ${esc(k)}`,
      `<p><b>${esc(cfg.names[k]||k)}</b> 템플릿을 지웁니다.</p>
       <p class="v88-note">${n?`이 코드에 걸리는 액티비티가 ${n}건 있습니다. 이미 받아 둔 ${n}건의 W/O 와 실적은 그대로 두고, 앞으로 수신되는 같은 코드의 액티비티는 기본(*) 템플릿으로 만들어집니다.`
                             :'지금 걸려 있는 액티비티는 없습니다.'}</p>`,
      `<button class="btn no" id="tpl-del-ok">삭제</button>`);
    $('#tpl-del-ok').onclick=()=>{ delete cfg.templates[k]; delete cfg.names[k];
      if(S.tplEdit&&S.tplEdit.orig===k) S.tplEdit=null;
      save(); $('#backdrop').classList.remove('on'); render();
      toast(`공정 템플릿 ${k} 삭제 · 설정 V${cfg.version}`,'ok'); };
  });
  document.querySelectorAll('[data-tpl-cancel]').forEach(el=>el.onclick=()=>{ S.tplEdit=null; render(); });
  document.querySelectorAll('[data-tpl-add]').forEach(el=>el.onclick=()=>{ draft().wo.push({cd:'',name:'',w:0}); render(); });
  document.querySelectorAll('[data-tpl-rm]').forEach(el=>el.onclick=()=>{ const i=+el.dataset.tplRm;
    if(draft().wo.length<2)return; draft().wo.splice(i,1); render(); });
  document.querySelectorAll('[data-tpl-up]').forEach(el=>el.onclick=()=>{ const i=+el.dataset.tplUp, w=draft().wo;
    [w[i-1],w[i]]=[w[i],w[i-1]]; render(); });
  document.querySelectorAll('[data-tpl-down]').forEach(el=>el.onclick=()=>{ const i=+el.dataset.tplDown, w=draft().wo;
    [w[i+1],w[i]]=[w[i],w[i+1]]; render(); });
  if($('#tpl-code')) $('#tpl-code').oninput=e=>{ draft().code=e.target.value.trim().slice(0,20); };
  if($('#tpl-name')) $('#tpl-name').oninput=e=>{ draft().name=e.target.value; };
  document.querySelectorAll('[data-tpl-cd]').forEach(el=>el.oninput=()=>{ draft().wo[+el.dataset.tplCd].cd=el.value.trim(); });
  document.querySelectorAll('[data-tpl-ser]').forEach(el=>el.oninput=()=>{draft().wo[+el.dataset.tplSer].ser=el.value.trim();});
  document.querySelectorAll('[data-tpl-nm]').forEach(el=>el.oninput=()=>{ draft().wo[+el.dataset.tplNm].name=el.value; });
  document.querySelectorAll('[data-tpl-w]').forEach(el=>el.oninput=()=>{ draft().wo[+el.dataset.tplW].w=Number(el.value);
    const sum=tplSum(draft().wo), box=document.querySelector('.tpl-sum');
    if(box){ box.textContent=`비중 합계 ${sum}% ${Math.abs(sum-100)>0.001?'· 100% 여야 저장됩니다':'· 저장 가능'}`;
      box.classList.toggle('bad', Math.abs(sum-100)>0.001); } });

  document.querySelectorAll('[data-tpl-save]').forEach(el=>el.onclick=()=>{
    const t=draft(); if(!t)return;
    const code=(t.code||'').trim();
    if(!code) return toast('적용 작업단계를 입력해 주세요. (* 는 기본 템플릿)','warn');
    if(code!=='*' && !STAGE_NAMES.includes(code))
      return toast(`'${code}' 는 작업단계 목록에 없습니다. ${STAGE_NAMES.slice(0,4).join('·')} … 중에서 입력해 주세요.`,'warn');
    if(code!==t.orig && cfg.templates[code]) return toast(`이미 ${code} 템플릿이 있습니다. 작업단계를 바꾸거나 기존 템플릿을 수정해 주세요.`,'warn');
    if(!t.name.trim()) return toast('템플릿명을 입력해 주세요.','warn');
    if(!t.wo.length) return toast('W/O 를 하나 이상 넣어 주세요.','warn');
    if(t.wo.some(w=>!w.name.trim())) return toast('작업명이 빈 W/O 가 있습니다.','warn');
    if(t.wo.some(w=>!Number.isFinite(Number(w.w))||w.w<0||w.w>100)) return toast('비중은 0~100 사이의 숫자입니다.','warn');
    if(Math.abs(tplSum(t.wo)-100)>0.001) return toast(`비중 합계가 ${tplSum(t.wo)}% 입니다. 100% 로 맞춰 주세요.`,'warn');
    if(t.wo.some(w=>!(/^[A-Z]{2}$/.test(w.cd||'')||w.cd==='--')||!/^\d{2}$/.test(w.ser||'')))return toast('세부분류코드 2자리와 W/O순번 2자리를 확인해 주세요.','warn');
    const ids=t.wo.map(w=>w.cd+'|'+w.ser);
    if(new Set(ids).size!==ids.length)return toast('세부분류코드와 W/O순번가 같은 W/O가 있습니다.','warn');
    const names = t.wo.map(w=>w.name.trim());
    if(new Set(names).size!==names.length) return toast('같은 작업명이 두 번 들어 있습니다.','warn');
    if(t.orig && t.orig!==code){ delete cfg.templates[t.orig]; delete cfg.names[t.orig]; }
    cfg.templates[code]=t.wo.map((w,i)=>({cd:(w.cd||'').trim()||'--', ser:(w.ser||'').trim()||String(i+1).padStart(2,'0'),
      name:w.name.trim(), w:Number(w.w)}));
    cfg.names[code]=t.name.trim();
    save(); S.tplEdit=null; render();
    toast(`${t.orig?'공정 템플릿 수정':'공정 템플릿 추가'} · ${code} · 설정 V${cfg.version}`,'ok');
  });
}
function v88newWO(stage){
  const c=DB.v88weights;const t=c?(c.templates[stage]||c.templates['*']):woTpl(stage);
  return t.map(w=>({code:w.cd,ser:w.ser,name:w.name,weight:w.w,done:false,part:0,start:null,end:null}));
}
function v88createActivity(key){
  /* key = 작업단계명. 같은 작업단계의 기존 건을 본떠 만들어 공종·코드가 어긋나지 않게 한다 (V97) */
  const source=DB.acts.find(a=>stageOf(a)===key)||DB.acts[0];
  const a=v88copy(source),wo=v88newWO(key);
  const stageCode=Object.keys(CD_STGE).find(k=>CD_STGE[k]===key);
  if(stageCode){a.gcode=stageCode[0];a.icode=stageCode[1];a.stage=key;a.grp=GRP_OF[a.gcode]||'기타';}
  else if(key==='*'){a.gcode='';a.icode='';a.stage='기본 예시';a.grp='기타';}
  a.preEnd=null;delete a.preEndSource;delete a.pcg;delete a.blockTypeCode;
  a.id='DEMO-'+Date.now()+'-'+(DB.acts.length+1);a.planStart=v88now().slice(0,10);a.planEnd=a.planStart;a.actStart=null;a.actEnd=null;a.delayed=false;a.expEnd=null;a.delayReason='';a.history=[];
  a.intake={wo:v88copy(wo),rate:null,prevRate:null,status:'none'};a.outtake={rate:null,prevRate:null,status:'none',auto:true};
  a.v88={wo,revision:0,weightVersion:'설정 V'+(DB.v88weights?.version||1),events:[],protected:[],erp:[],request:null,draft:null,last:null,hasActual:false};
  DB.acts.push(a);v88sync(a);v88log(a,'기준정보','ERP 신규 Activity 수신 체험 · 생성 당시 가중치 적용');persist();return a;
}

function v88action(action){

    case 'discard':x.draft=null;if(x.erpHold){v88autoRequest(a);x.erpHold=null;}render();return;
    case 'cancel':if(!x.request||x.request.kind==='auto'||!isWorker())return;x.draft=v88copy(x.request);x.request=null;x.last=null;v88sync(a);v88log(a,'요청취소','신청 취소 · 확정 실적 유지');render();return;

    case 'reject':return openReject(a,'intake');

function ctCfg(){
 if(DB.commonTemplates)return DB.commonTemplates;
 const cfg=DB.commonTemplates={records:{},deleted:[],history:[],version:1,sourceOverrides:{}};
 // 이전 Activity별 사용자 비중은 별도 유형으로 승계한다. 이미 생성한 실적은 건드리지 않는다.
 for(const [id,override] of Object.entries(DB.activityTemplates?.overrides||{})){
  const original=COMMON_TEMPLATE_SOURCE.find(r=>r.sources.some(s=>s.activity===id));if(!original||!Array.isArray(override.weights)||override.weights.length!==original.wo.length)continue;
  if(original.wo.every((w,i)=>w.weight===override.weights[i]))continue;
  const r=v88copy(original);r.id='LEG-'+id;r.label=r.activityName+' · 기존 설정 '+id;r.version=1;r.sources=r.sources.filter(s=>s.activity===id);r.wo.forEach((w,i)=>w.weight=override.weights[i]);cfg.records[r.id]=r;cfg.sourceOverrides[id]=r.id;
 }return cfg;
}
function ctCatalog(){const c=ctCfg(),removed=new Set(c.deleted);return [...COMMON_TEMPLATE_SOURCE.map(r=>c.records[r.id]||r),...Object.values(c.records).filter(r=>!COMMON_TEMPLATE_SOURCE.some(s=>s.id===r.id))].filter(r=>!removed.has(r.id));}
function ctGet(id){return ctCatalog().find(r=>r.id===id);}
function ctSources(r){const map=ctCfg().sourceOverrides;return (r.sources||[]).filter(s=>!map[s.activity]||map[s.activity]===r.id);}
const ctSignature=r=>JSON.stringify([r.activityName.trim(),r.wo.map(w=>[w.code.trim(),w.ser.trim(),w.name.trim(),w.weight])]);
const ctComparable=r=>JSON.stringify([r.id,r.activityName,r.label,r.wo.map(w=>[w.code,w.ser,w.name,w.weight])]);
function ctIssues(r){
 const e=[];if(!/^[A-Za-z0-9_-]{1,80}$/.test(r.id||''))e.push('유형 ID 형식 확인');
 if(!r.activityName?.trim()||!r.label?.trim())e.push('Activity 명칭·유형명 필수');
 if(!r.wo.length)e.push('W/O 1개 이상 필요');
 if(r.wo.some(w=>!w.code?.trim()||!w.ser?.trim()||!w.name?.trim()))e.push('세부분류·W/O순번·작업내용 필수');
 if(r.wo.some(w=>!Number.isFinite(w.weight)||w.weight<0||w.weight>100))e.push('비중 0~100 숫자 필요');
 const sum=r.wo.reduce((n,w)=>n+w.weight,0);if(!Number.isFinite(sum)||Math.abs(sum-100)>.00001)e.push('비중 합계 100% 필요');
 if(new Set(r.wo.map(w=>w.code+'|'+w.ser)).size!==r.wo.length)e.push('세부분류+W/O순번 중복');

}
function ctValidateChanges(changes){
 const e=[],seen=new Set(),result=new Map(ctCatalog().map(r=>[r.id,r]));
 for(const c of changes){if(seen.has(c.id))e.push(c.id+': 중복 처리');seen.add(c.id);const old=result.get(c.id);
  if(!['추가','수정','삭제'].includes(c.action)){e.push(c.id+': 처리 구분 오류');continue;}
  if(c.action==='추가'&&old||c.action!=='추가'&&!old)e.push(c.id+': '+c.action+' 대상 확인');
  if(c.action==='삭제'){result.delete(c.id);continue;}
  if(c.row.id!==c.id)e.push(c.id+': ID 불일치');e.push(...ctIssues(c.row).map(m=>c.id+': '+m));result.set(c.id,c.row);
 }
 // 기존 오류 원본은 조회용으로 유지하되 새 변경이 동일 유형을 중복 생성하지 않게 한다.
 for(const c of changes.filter(c=>c.row))for(const [id,r] of result){if(id!==c.id&&ctSignature(r)===ctSignature(c.row))e.push(c.id+': '+id+'와 동일한 공통 구성');}

}
function ctApply(changes,reason){

 const errors=ctValidateChanges(changes);if(errors.length)throw Error(errors.join(' · '));
 const cfg=ctCfg();const next=v88copy(cfg);
 for(const c of changes){const old=ctGet(c.id);next.history.push({id:c.id,action:c.action,before:old?v88copy(old):null,after:c.row?v88copy(c.row):null,reason,by:S.user.name,at:v88now()});
  if(c.action==='삭제')next.deleted=[...new Set([...next.deleted,c.id])];
  else{next.records[c.id]={...v88copy(c.row),sources:v88copy(old?.sources||c.row.sources||[]),version:(old?.version||1)+1};next.deleted=next.deleted.filter(id=>id!==c.id);}

}

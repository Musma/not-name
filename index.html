/* ---------- 브라우저 저장소 (V80) ----------
   실적·이력·문서번호·알림·연계 이력은 항상 보관하고, 새로고침해도 이어진다.
   로그인 세션과 작성 중 초안은 '로그인 상태 유지'가 켜진 경우에만 복구한다.
   '데이터 초기화'가 저장소까지 비운다. */
const STORE_KEY = 'dpc-proto-v88';
function persist(){
  try{
    const snap = { db: DB, docseq: DOCSEQ, sfpo: SFPO.hist, ltwin: LTWIN.hist,
                   session: S.remember && S.user ? { user:S.user, view:S.view, regMode:S.regMode, tab:S.tab,
                             quick:S.quick, selectedId:S.selectedId, draft:S.draft } : null };
    localStorage.setItem(STORE_KEY, JSON.stringify(snap));
  }catch(e){ /* 저장소가 막힌 환경 — 메모리로만 동작 */ }
}
function restore(){
  try{
    const raw = localStorage.getItem(STORE_KEY); if(!raw) return false;
    const snap = JSON.parse(raw);
    if(!snap || !snap.db || !Array.isArray(snap.db.acts) || snap.db.acts.length < 20) return false;
    DB = snap.db;
    Object.keys(DOCSEQ).forEach(k=>delete DOCSEQ[k]); Object.assign(DOCSEQ, snap.docseq || {});
    if(snap.sfpo)  SFPO.hist  = snap.sfpo;
    if(snap.ltwin) LTWIN.hist = snap.ltwin;
    if(snap.session && snap.session.user){
      const ss = snap.session;
      S.user = ss.user; S.view = ss.view || 'reg'; S.regMode = ss.regMode || 'intake'; S.tab = ss.tab || 'intake';
      S.quick = ss.quick || 'all'; S.selectedId = ss.selectedId || null;
      if(ss.draft && actById(ss.draft.id)){ S.draft = ss.draft; }
    }
    return true;
  }catch(e){ return false; }
}
function clearStore(){ try{ localStorage.removeItem(STORE_KEY); }catch(e){} }

function resetAll(fromStore){
  if(fromStore){ /* 저장된 상태로 시작 — 시드는 만들지 않는다 (V80) */
    S = blankState();
    if(restore()){ render(); if(S.draft) toast('작성 중이던 실적 입력을 복구했습니다.'); return; }
  }
  clearStore();
  DB = { acts: seedActivities(), notis: seedNotifications() };
  Object.keys(DOCSEQ).forEach(k=>delete DOCSEQ[k]);   // 채번 카운터 초기화 (V64)
  seedDocNos(DB.acts);                                // 결재 문서번호 먼저 (이력이 참조한다)
  DB.acts.forEach(a=>{ a.history = seedHistory(a); });
  SFPO.hist = SFPO_SEED.map(h=>({...h}));
  LTWIN.hist = LTWIN_SEED.map(h=>({...h}));
  /* 물류Twin 자동 반영 (수신분) : 2603E50ZPE10E40 — 배차 완료 → 첫 W/O 자동 완료 + 공정율 스냅 + 이력 */
  {
    const la = DB.acts.find(a=>a.id==='2603E50ZPE10E40');
    if(la && la.intake.wo.length){
      const w0 = la.intake.wo[0];
      w0.done = true; w0.auto = {at:T(0,'10:40'), no:'D-2609-014', veh:'T/P-02'};
      la.intake.rate = woRate(la.intake.wo);
      la.history.unshift(
        {at:T(0,'10:40'), by:'물류Twin', kind:'자동', mode:'intake', date:T(0),
         detail:`배차 완료 (D-2609-014 · T/P-02) → W/O ${w0.name} 자동 완료 · 공정율 미입력 → ${la.intake.rate}% (저장까지 자동 · 승인요청은 확인 후)`},
        {at:T(0,'10:38'), by:'물류Twin', kind:'이동', mode:'intake', date:T(0),
         detail:'블록 이동 1야드 A-12 → 1야드 P-07 (T/P-02 · 배차 D-2609-014)'});
    }
    const mv = DB.acts.find(a=>a.id==='4516S384AS10S10');
    if(mv) mv.history.push(
      {at:T(-1,'16:50'), by:'물류Twin', kind:'이동', mode:'intake', date:T(-1),
       detail:'자재 이동 2야드 자재장 → 1야드 P-02 (지게차 F-07 · 배차 D-2609-006)'});
  }
  S = blankState();
  render();
  toast('프로토타입 데이터를 초기화했습니다.');
}

   유틸
   ============================================================ */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const d2 = n => String(n).padStart(2,'0');
function dstr(s){ return s? s.slice(5).replace('-','/') : '-'; }
/* 블록 표기 : 호선(PROJ) + 블록(Block) + PE BLK — 실행계획 식별 체계 */
function blkLabel(a){ return `${a.hull}-${a.block}`; }
function blkSub(a){ return `${a.grp} · ${a.shop}`; }
function numStr(v){ return v==null?'-':Number(v).toLocaleString(undefined,{maximumFractionDigits:1}); }
function dayDiff(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
/* 날짜에 n일 더하기 — 선공정 완료 다음날 같은 계산에 쓴다 (V99) */
function addDays(s, n){ if(!s) return null;
  const d = new Date(String(s).slice(0,10)+'T00:00:00'); d.setDate(d.getDate()+n);
  return `${d.getFullYear()}-${d2(d.getMonth()+1)}-${d2(d.getDate())}`; }
function nowStamp(){ const d=new Date(); return `${TODAY} ${d2(d.getHours())}:${d2(d.getMinutes())}`; }
function weekday(s){ return ['일','월','화','수','목','금','토'][new Date(s+'T00:00:00').getDay()]; }

function toast(msg, kind=''){
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  const ic = kind==='ok'?'bi-check-circle-fill':kind==='no'?'bi-x-circle-fill':kind==='warn'?'bi-exclamation-triangle-fill':'bi-info-circle-fill';
  el.innerHTML = `<i class="bi ${ic}"></i><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

function isWorker(){ return S.user?.role==='worker'; }
function isManager(){ return S.user?.role==='manager'; }
function isAdmin(){ return S.user?.role==='admin'; }

/* 역할 기준 데이터 범위 */
function scopeActs(){
  let a = DB.acts;
  if(isWorker()) a = a.filter(x=>x.company===S.user.company);
  return a;
}
function myNotis(){
  return DB.notis.filter(n=> isWorker() ? (n.role==='worker' && n.to===S.user.company)
                                        : (n.role==='manager'));
}
function unread(){ return myNotis().filter(n=>!n.read).length; }

/* 상태 계산 */
function perf(a, mode){ return mode==='outtake' ? a.outtake : a.intake; }
function statusOf(a, mode){
  const p = perf(a, mode);
  if(p.status==='done') return 'done';
  if(p.status==='wait') return 'wait';
  if(p.status==='rej')  return 'rej';     // 반려 : 재입력 대상으로 별도 식별
  return 'none';   // 저장만 하고 요청 전이면 착수·완료 모두 미등록으로 본다
}
const ST_LABEL = {none:'실적누락', wait:'승인대기', done:'승인완료', rej:'반려'};
/* 완료 구분의 none 은 착수 누락과 다르다(착수는 이미 승인완료) → 라벨 분리 */
/* 완료 실적 미등록 건의 기본 공정율 — 착수에서 확정된 진척을 이어받는다 */
function baseRate(a, mode){
  const r = perf(a, mode).rate;
  if(r != null) return r;
  return mode==='outtake' ? (perf(a,'intake').rate ?? 0) : 0;
}
/* ------------------------------------------------------------------
   상태 라벨 단일 소스 (V60) — 화면이 달라도 같은 건은 같은 문구로 읽힌다.
     stage=true : 착수·완료가 섞이는 목록에서 구분을 라벨 앞에 붙인다
                  (완료 계열은 문구에 '완료'가 이미 들어 있어 접두사가 필요 없다)
     반환 {st, t} — st 는 색 클래스 키
   ------------------------------------------------------------------ */
function perfLabel(a, mode){
  const p = perf(a, mode);
  const st = statusOf(a, mode);
  if(mode==='outtake'){   /* 자동 파생 — 종결 여부만 표현한다 (V61) */
    return st==='done' ? {st:'done', t:'승인완료 · 종결'} : {st:'gray', t:'진행 중'};
  }
  /* 100% 미만 승인은 '이번 진척이 확정됐다'는 뜻 — 다음 진척 입력이 남아 있다 (V61) */
  if(st==='done')  return isClosed(a)
      ? {st:'done', t:'승인완료 · 종결'} : {st:'done', t:'승인완료 · 진행 중'};
  if(st==='wait')  return {st:'wait', t:'승인대기'};
  if(st==='rej')   return {st:'rej',  t:'반려'};
  if(p.rate!=null) return {st:'gray', t:'저장 · 요청 전'};
  return {st:'none', t:'실적누락'};
}
/* 태그 1개로 렌더 */
function perfTag(a, mode){
  const L = perfLabel(a, mode);
  return `<span class="tag ${ST_CLS[L.st]}">${L.t}</span>`;
}
/* 수치 칸 — 값이 없으면 '—'. 상태 문구를 반복하지 않는다 (V60 규칙 C) */
function rateCell(a, mode){
  const p = perf(a, mode);
  return p.rate==null ? `<span class="pct none">—</span>`
    : `<div class="mini-bar"><i style="width:${p.rate}%"></i></div><span class="pct">${p.rate}<small>%</small></span>`;
}
/* 간트·지연현황은 확정 실적 관점을 쓴다 (V66) */
function stageStatus(a){ return confirmState(a); }
const ST_CLS   = {none:'t-none', wait:'t-wait', done:'t-done', rej:'t-rej', gray:'t-gray'};
const ROW_CLS  = {none:'k-none', wait:'k-wait', done:'k-done', rej:'k-rej'};

function intakeComplete(a){ return a.intake.status==='done'; }
/* 종결 = 공정율 100%가 승인된 상태. 종결 전에는 승인 후에도 진척을 이어서 올린다 (V61) */
function isClosed(a){ return a.outtake.status==='done'; }

/* ---------- 확정 실적 (V66) ----------
   조회 화면(실적확인·지연현황·계획일정)이 쓰는 유일한 기준.
   '승인된 공정율'만이 사실이다 — 요청 중이거나 반려된 값은 여기 나타나지 않는다.
   (그 값들은 작업자의 실적등록과 관리자의 승인함에서만 다룬다) */
function apprRate(a){
  const p = a.intake;
  if(p.status === 'done') return p.rate;      // 방금 승인된 값
  return p.prevRate ?? null;                  // 대기·반려·미등록 → 직전 승인값 (없으면 미승인)
}
/* 확정 공정율을 만든 승인 문서번호 — apprRate 와 같은 분기 (V84).
   승인완료 건은 그 결재 문서, 대기·반려 건은 직전 승인 사이클의 문서, 승인 이력이 없으면 없음. */
function apprDoc(a){
  const p = a.intake;
  if(p.status === 'done') return p.docNo || null;
  return p.prevRate != null ? (p.docPrev || null) : null;
}
/* 확정 실적 상태 — 결재 상태(perfLabel)와 섞지 않는다.
   승인 실적이 없는 건은 두 가지로 갈린다 (V68) :
     착수 전   — 계획착수일 미도래. 실적이 없는 게 정상이므로 관리 대상이 아니다.
     실적누락  — 계획착수일 경과. 독촉 대상. */
function confirmState(a){
  if(isClosed(a))          return {st:'done', t:'종결'};
  if(apprRate(a) != null)  return {st:'wait', t:'진행 중'};
  return dayDiff(a.planStart, TODAY) >= 0 ? {st:'none', t:'실적누락'}
                                          : {st:'gray', t:'착수 전'};
}
function confirmTag(a){ const c = confirmState(a);
  return `<span class="tag ${ST_CLS[c.st]}">${c.t}</span>`; }
/* 확정 공정율 시점의 워크오더 상태 — 조회 화면의 상세가 승인값과 어긋나지 않도록
   저장된(미승인) 완료 처리 대신 승인된 공정율까지만 완료로 되돌려 보여준다 (V66) */
function apprWO(a){
  const r = apprRate(a);
  let acc = 0, stop = false;
  return a.intake.wo.map(w=>{
    const done = r != null && !stop && acc + w.weight <= r;
    if(done) acc += w.weight; else stop = true;
    const part = (!done && r != null && r > acc)
      ? Math.max(0, Math.min(99, Math.round((r - acc) / w.weight * 100))) : 0;
    return {...w, done, part};
  });
}
/* 조회 화면의 공정율 칸 — 수치만. 없으면 '—' (상태는 태그가 말한다 · V60 규칙 C) */
function apprRateCell(a){
  const r = apprRate(a);
  return r == null ? `<span class="pct none">—</span>`
    : `<div class="mini-bar"><i style="width:${r}%"></i></div><span class="pct">${r}<small>%</small></span>`;
}
function delayDays(a){ return dayDiff(a.planEnd, TODAY); }
function lateDays(a){ return Math.max(0, a.expEnd ? dayDiff(a.planEnd, a.expEnd) : delayDays(a)); }
/* 종결 전이면 승인 진척이 있어도 계획완료일이 지났으면 지연이다 (V73 · 기존 착수승인 기준은 오판) */
function isLate(a){ return a.delayed || (delayDays(a)>0 && !isClosed(a)); }

/* 필터 */
function filteredActs(mode){
  let list = scopeActs();
  if(mode==='outtake') list = list.filter(intakeComplete);
  if(S.hull!=='all')    list = list.filter(a=>a.hull===S.hull);
  if(S.block!=='all')   list = list.filter(a=>a.block===S.block);
  if(S.company!=='all' && !isWorker()) list = list.filter(a=>a.company===S.company);
  if(S.grp!=='all')     list = list.filter(a=>a.grp===S.grp);
  if(S.stage!=='all')   list = list.filter(a=>stageOf(a)===S.stage);
  const k = S.keyword.trim().toLowerCase();
  if(k) list = list.filter(a=>[a.id,a.hull,a.block,blkLabel(a),a.grp,a.company,a.stage,stageOf(a)].join(' ').toLowerCase().includes(k));
  /* 기간 조회 — 기준 일자가 기간 안에 있는 건만 (승인함은 요청일/처리일을 행 단위로 따로 거른다) */
  if((S.dRange.from || S.dRange.to) && S.view!=='appr' && S.view!=='sched'){
    const f = S.dRange.from || '0000-01-01', t = S.dRange.to || '9999-12-31';
    const basis = S.view==='delay' ? 'end' : S.dRange.basis;
    const dOf = a => {
      if(basis==='plan') return a.planStart;
      if(basis==='end')  return a.planEnd;
      const d = basis==='req' ? perf(a, mode).requestedAt : perf(a, mode).approvedAt;
      return d ? d.slice(0,10) : null;
    };
    list = list.filter(a=>{ const d = dOf(a); return !!d && d >= f && d <= t; });
  }
  if(S.quick!=='all') list = list.filter(a=>quickHit(a, mode, S.quick));
  // 정렬 : 지연 > 누락 > 계획착수일
  /* 지연 > 실적누락 > 나머지. '착수 전'은 관리 대상이 아니므로 뒤로 (V68) */
  const rank = a => (isLate(a)?0:1)*10
    + ((isManager()||isAdmin())
        ? (apprRate(a)!=null ? 1 : (dayDiff(a.planStart, TODAY) >= 0 ? 0 : 2))
        : (statusOf(a,mode)==='none' ? 0 : 1));
  return list.sort((x,y)=> rank(x)-rank(y) || x.planStart.localeCompare(y.planStart));
}
/* 퀵필터 판정 — 작업자는 결재 상태(none/wait/done/rej),
   관리자는 확정 실적 관점(pre 착수 전 / miss 실적누락 / ing 진행 중 / cls 종결)으로 나뉜다 (V68) */
function quickHit(a, mode, k){
  switch(k){
    case 'all':  return true;
    case 'none': return statusOf(a, mode)==='none';
    case 'wait': return statusOf(a, mode)==='wait';
    case 'done': return statusOf(a, mode)==='done';
    case 'rej':  return statusOf(a, mode)==='rej';
    case 'pre':  return apprRate(a)==null && dayDiff(a.planStart, TODAY) < 0;   // 착수 전
    case 'miss': return apprRate(a)==null && dayDiff(a.planStart, TODAY) >= 0;  // 실적누락
    case 'ing':  return apprRate(a)!=null && !isClosed(a);
    case 'cls':  return isClosed(a);
  }
  return true;
}

function quickCounts(mode){
  const base = (()=>{ const q=S.quick; S.quick='all'; const l=filteredActs(mode); S.quick=q; return l; })();
  const c = k => base.filter(a=>quickHit(a, mode, k)).length;
  return {all:c('all'), none:c('none'), wait:c('wait'), done:c('done'), rej:c('rej'),
          pre:c('pre'), miss:c('miss'), ing:c('ing'), cls:c('cls')};
}

function actById(id){ return DB.acts.find(a=>a.id===id); }

/* 이력 — 실적구분(착수/완료)과 실적일자를 함께 남긴다 (일정 · 실적 추적용) */
/* ---------- 결재 문서번호 (V64) ----------
   요청 1건 = 결재 문서 1건. 형식 DPC-YYYYMM-NNNN (연월별 4자리 일련).
   반려 후 재요청·진척 재요청은 새 번호를 받고, 요청 취소분은 폐기한다. */
const DOC_PREFIX = 'DPC';
const DOCSEQ = {};                                  // { '202605': 마지막 일련 }
function nextDocNo(at){
  const ym = (at || nowStamp()).slice(0,7).replace('-','');
  DOCSEQ[ym] = (DOCSEQ[ym] || 0) + 1;
  return `${DOC_PREFIX}-${ym}-${String(DOCSEQ[ym]).padStart(4,'0')}`;
}
/* 결재 행위 — 이 이력에는 문서번호가 따라붙는다 */
const DOC_KINDS = ['승인요청','승인','반려','요청취소','승인취소','종결'];

function log(a, kind, detail, mode, at, doc){
  const t = at || nowStamp();
  a.history.unshift({ at: t, by: S.user.name, kind, detail,
                      mode: mode || null, date: t.slice(0,10),
                      doc: doc !== undefined ? doc
                           : (DOC_KINDS.includes(kind) ? (perf(a, mode||'intake').docNo || null) : null) });
}
/* 결재 문서번호 칩 — 화면 어디서나 이 한 함수로만 그린다 (V83).
   형식 DPC-YYYYMM-NNNN (시스템코드-연월-일련, V64). 목록·이력은 sm, 헤더·모달·액션바는 기본 크기. */
function docChip(no, sm){
  if(!no) return '';
  return `<span class="docno${sm?' sm':''}" title="결재 문서번호 · 요청 1건 = 문서 1건 (DPC-연월-일련)"><em>No.</em>${esc(no)}</span>`;
}
function pushNoti(o){
  DB.notis.unshift({id:'N-'+Math.random().toString(36).slice(2,8), time:'방금 전', read:false, ...o});
}

/* ============================================================
   렌더 : 최상위
   ============================================================ */
/* ---------- 목록 스크롤 보존 (V75) ----------
   render()는 #app 전체를 다시 그린다. 행을 선택해도 '보던 자리'는 그대로여야 하므로
   다시 그리기 직전의 스크롤 위치를 담아 두었다가, 조회 조건이 그대로면 되돌려 놓는다.
   조회 조건(화면·탭·퀵필터·검색어·축 필터·정렬·기간)이 바뀌면 처음부터 본다. */
const SCROLL_IDS = ['reglist','apprlist','viewbody'];
let SCROLL_KEEP = {}, SCROLL_KEY = null, SCROLL_OK = false;
/* 본문이 크게 넘치면 본문 자체를 스크롤 가능하게 한다 (V98).
   #viewbody 는 두 칸 배치를 위해 overflow:hidden 이라, 안쪽에 스스로 스크롤하는 패널이 없는
   화면에서는 아래쪽 내용에 손이 닿지 않았다. 반올림 오차로 스크롤막대가 깜빡이지 않도록
   40px 이상 넘칠 때만 켠다. 켜도 높이는 달라지지 않으므로 몇 번을 불러도 결과가 같다. */
function fitScroll(){
  const el = document.getElementById('viewbody'); if(!el) return;
  el.classList.toggle('scrolly', el.scrollHeight - el.clientHeight > 40);
}
function scrollCtx(){
  return [S.view, S.regMode, S.apprView, S.quick, S.dquick, S.keyword,
          S.hull, S.block, S.company, S.grp, S.stage, S.regSort,
          S.dRange && S.dRange.from, S.dRange && S.dRange.to].join('|');
}
function saveScroll(){
  const m = {};
  SCROLL_IDS.forEach(id=>{ const el = document.getElementById(id); if(el) m[id] = el.scrollTop; });
  document.querySelectorAll('#viewbody .card-b').forEach((el,i)=>{ m['card'+i] = el.scrollTop; });
  SCROLL_KEEP = m;
}
function restoreScroll(){
  SCROLL_IDS.forEach(id=>{ const el = document.getElementById(id);
    if(el && SCROLL_KEEP[id]) el.scrollTop = SCROLL_KEEP[id]; });
  document.querySelectorAll('#viewbody .card-b').forEach((el,i)=>{
    if(SCROLL_KEEP['card'+i]) el.scrollTop = SCROLL_KEEP['card'+i]; });
}
/* 목록 안에서 이미 보이는 행은 건드리지 않는다 — 클릭한 행이 움직이면 안 된다 (V75) */
function revealRow(el){
  if(!el) return;
  const pane = el.closest('.pane-body, .card-b');
  if(!pane){ el.scrollIntoView({block:'nearest'}); return; }
  const r = el.getBoundingClientRect(), p = pane.getBoundingClientRect();
  if(r.top < p.top)         pane.scrollTop += r.top - p.top;
  else if(r.bottom > p.bottom) pane.scrollTop += r.bottom - p.bottom;
}

function render(){
  if(S.view==='delay')S.view=isWorker()?'reg':'home';
  renderDevbar();
  /* 현장 작업자 로그인 시 글로브 모드 — 터치 타깃·글자 확대 (V53 · 갤럭시탭 A11) */
  document.body.classList.toggle('r-worker', !!S.user && isWorker());
  const app = $('#app');
  if(!S.user){ app.innerHTML = viewLogin(); bindLogin(); SCROLL_KEY = null; return; }
  const prevKey = SCROLL_KEY;          // 지금 화면에 그려져 있는 조회 조건
  saveScroll();
  const key = scrollCtx();             // 새로 그릴 조회 조건
  app.innerHTML = `
    ${railHTML()}
    ${appbarHTML()}
    ${filterbarHTML()}
    <main class="body ${hasFilter()?'':'nofilter'}" id="viewbody">${viewHTML()}</main>`;
  bindCommon();
  bindView();
  SCROLL_OK = (key === prevKey);
  if(SCROLL_OK) restoreScroll();
  SCROLL_KEY = key;
  persist();                            // 그린 상태를 저장소에 (V80)
}

function renderDevbar(){
  $('#roleswitch').innerHTML = Object.values(USERS).map(u=>
    `<button class="${S.user?.role===u.role?'on':''}" onclick="switchRole('${u.role}')">${u.label}</button>`).join('');
  $('#dev-info').textContent = S.user ? `${S.user.name} · ${S.user.company}` : '로그인 필요';
}

function switchRole(role){
  if(S.draft){ confirmDiscard(()=>switchRole(role)); return; }   /* 역할 변경도 초안을 버린다 — 먼저 묻는다 (V80) */
  S.user = {...USERS[role]};
  S.view = 'home'; S.selectedId=null; S.quick='all'; S.keyword=''; S.checked=[]; S.draft=null;
  S.regMode = 'intake'; S.tab = 'intake';        // 이전 역할의 실적구분이 남지 않도록 (V73)
  S.company = 'all'; S.hull='all'; S.block='all'; S.stage='all';
  if(isAdmin()) S.view='admin';
  /* 관리자는 승인 대기가 있으면 승인함으로 직행 — 첫 업무 = 결재 (V47) */
  if(isManager() && apprTotal() > 0) S.view = 'appr';
  /* 현장 작업자는 로그인 즉시 실적등록(내 할 일) — 단일 화면 (V46) */
  if(isWorker()){
    S.view='reg'; S.quick='todo'; S.tab=S.regMode;
    /* 가로 화면(목록+상세 나란히)에서는 첫 할 일을 미리 열어 둔다 — 세로(상세가 덮음)에서는 목록부터 (V79) */
    if(window.innerWidth > 1180){ const f = todoRows()[0]; if(f) S.selectedId = f.a.id; }
  }
  render();
}

/* ---------- 레일 ---------- */
function menus(){
  /* 현장 작업자는 실적등록 + 계획일정 — 필요 최소 2개 화면 (V46 간소화 · V48 일정 복원)
     알림은 우상단 벨 하나로 — 레일의 '알림' 메뉴는 벨과 중복이라 제거 (V86) */
  if(isWorker()) return [ {v:'reg', i:'bi-pencil-square', t:'실적등록'},
                          {v:'sched', i:'bi-calendar3-range', t:'계획일정'} ];
  return [
    {v:'home',  i:'bi-grid-1x2-fill', t:'홈'},
    ...(isManager()||isAdmin() ? [{v:'appr', i:'bi-inbox-fill', t:'승인함', badge:apprTotal(),
       h:'올라온 승인 요청을 승인·반려 — 결재 전담 화면'}] : []),
    {v:'reg',   i:isManager()?'bi-check2-square':'bi-pencil-square', t:isManager()?'실적확인':'실적등록',
     h:isManager()?'담당 물량 전체 현황 — 실적누락 독촉 · 확정 실적 조회':'공정율 실적 등록 및 승인요청'},
    {v:'sched', i:'bi-calendar3-range', t:'계획일정'},
  ];
}
function railHTML(){
  return `<nav class="rail">
    <div class="logo">HOE</div>
    ${menus().map(m=>`<button class="rail-item ${S.view===m.v?'on':''}" data-go="${m.v}"${
      m.h?` title="${esc(m.h)}"`:''}>

                       :'공정율 실적 등록 및 승인요청'],

function countWait(){ return scopeActs().filter(a=>statusOf(a,'intake')==='wait'||statusOf(a,'outtake')==='wait').length; }
function lateList(){

}

/* ---------- 필터바 ---------- */
function hasFilter(){ return ['reg','delay','sched','appr'].includes(S.view); }

/* ---------- 기간 조회 ---------- */
const DR_BASIS = {plan:'월간계획착수일', end:'월간계획완료일', req:'요청일', appr:'승인일'};
function drLabel(){
  const {from, to} = S.dRange;
  if(!from && !to) return '기간';
  const d = x => x ? x.slice(5).replace('-','/') : '';
  return `${d(from)||'~'} ~ ${d(to)||''}`;
}
function positionDrPop(){
  const pop = document.querySelector('.fb-date-pop');
  const btn = document.querySelector('.fb-date-btn');
  if(!pop || !btn) return;
  const r = btn.getBoundingClientRect();
  pop.style.top  = (r.bottom + 8) + 'px';
  pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 316)) + 'px';
}
function dateFilterHTML(){
  const on = S.dRange.from || S.dRange.to;
  const basisFixed = S.view==='appr' ? (S.apprView==='done' ? '처리일 기준' : '요청일 기준')
                   : S.view==='delay' ? '월간계획완료일 기준'
                   : S.view==='sched' ? '간트 시간축으로 반영 · 겹치는 건 표시' : null;
  return `<span class="fb-date">
    <button class="fb-date-btn ${on?'on':''} ${S.drOpen?'open':''}" data-act="toggledr"
      title="기간으로 조회 범위를 좁힙니다"><i class="bi bi-calendar-range"></i>${drLabel()}</button>
    ${S.drOpen ? `<div class="fb-date-pop">
      <div class="fp-h"><b>기간 조회</b><span>${basisFixed || '기준 일자를 선택해 주세요'}</span></div>
      ${basisFixed ? '' : `<div class="fp-row"><label>기준</label>
        <select class="sel" id="f-basis">${Object.entries(DR_BASIS).map(([k,t])=>

      <div class="fp-row"><label>시작</label><input class="inp" type="date" id="f-from" value="${S.dRange.from}"></div>
      <div class="fp-row"><label>종료</label><input class="inp" type="date" id="f-to" value="${S.dRange.to}"></div>
      <div class="fp-foot">
        <button class="btn sm" data-act="drclear" ${on?'':'disabled'}>지우기</button>

function filterbarHTML(){
  if(!hasFilter()) return '';
  const worker = isWorker();
  /* 선택지는 '내가 볼 수 있는 범위'에서만 만든다 — 작업자에게 배정 없는 호선은 뜨지 않는다 (V78) */
  const scope = scopeActs();
  const hulls = [...new Set(scope.map(a=>a.hull))].sort();
  const blocks = S.hull==='all' ? [] : [...new Set(scope.filter(a=>a.hull===S.hull).map(a=>a.block))].sort();
  const comps = [...new Set(DB.acts.map(a=>a.company))];
  /* 작업자는 호선·블록·기간 3종만 — 협력사는 본인 소속으로 고정, 공정은 목록이 짧아 불필요 (V78) */
  const showStage = S.view==='reg' && !worker;
  return `<div class="filterbar${worker?' fb-worker':''}">
    <select class="sel" id="f-hull">
      <option value="all">전체 호선</option>
      ${hulls.map(h=>`<option ${S.hull===h?'selected':''}>${h}</option>`).join('')}
    </select>
    <select class="sel" id="f-block" ${S.hull==='all'?'disabled':''}>
      ${S.hull==='all'?'<option>블록 (호선 먼저 선택)</option>':
        `<option value="all">전체 블록</option>${blocks.map(b=>`<option ${S.block===b?'selected':''}>${b}</option>`).join('')}`}
    </select>
    ${worker ? ''
      : `<select class="sel" id="f-comp"><option value="all">전체 협력사</option>${comps.map(c=>`<option ${S.company===c?'selected':''}>${c}</option>`).join('')}</select>`}
    ${dateFilterHTML()}
    ${showStage?`<div class="divider-v"></div>
    <select class="sel" id="f-stage" style="min-width:132px" title="공정 선택 (그룹별 묶음)">
      <option value="all">전체 공정</option>
      ${STAGE_GRPS.map(g=>`<optgroup label="${g}">${stageList().filter(x=>x.grp===g).map(x=>
        `<option value="${x.code}" ${S.stage===x.code?'selected':''}>${x.code}</option>`).join('')}</optgroup>`).join('')}
    </select>`:''}
    <span class="sp" style="flex:1"></span>
  </div>`;
}

function bindLogin(){
  const go = ()=>{
    const id = $('#lg-id').value.trim(), pw = $('#lg-pw').value.trim();

    switchRole(role);
    toast(`${USERS[role].label} 계정으로 로그인했습니다.`, 'ok');
  };
  $('#lg-go').onclick = go;
  $('#lg-pw').onkeydown = e=>{ if(e.key==='Enter') go(); };

/* 작업자 알림 화면 — 홈 대신 알림만. 처리할 일은 실적등록 '내 할 일'이 이미 맡는다 (V79)
   진입은 우상단 벨 하나 (V86) */
function viewWorkerNotis(){
  const notis = myNotis();
  const un = notis.filter(n=>!n.read).length;
  return `
  <div class="card" style="height:100%;">
    <div class="card-h"><h3>알림</h3>
      <span class="note" style="margin-left:8px">미읽음 ${un}건</span>
      <span class="sp" style="flex:1"></span>
      ${un ? `<button class="btn sm" data-act="readall">모두 읽음</button>` : ''}</div>
    <div class="card-b">${notis.length ? notis.map(notiHTML).join('') : emptyHTML('알림이 없습니다','')}</div>
  </div>`;
}
function viewHome(){
  if(isWorker()) return viewWorkerNotis();
  const list = scopeActs();
  const view = isManager()||isAdmin();
  const cntNone = view
      ? list.filter(a=>apprRate(a)==null && dayDiff(a.planStart,TODAY)>=0).length
      : list.filter(a=>statusOf(a,'intake')==='none' && dayDiff(a.planStart,TODAY)>=0).length;
  const cntWait = list.filter(a=>statusOf(a,'intake')==='wait').length;
  const cntDone = view ? list.filter(isClosed).length
                       : list.filter(a=>a.intake.status==='done').length;
  const late = list.filter(isLate);
  /* 처리할 작업 : 착수일이 도래한 미완료 건 + 지연 건을 한 목록으로 묶는다.
     지연 건은 상단에 배치하고 행의 '지연' 뱃지로 구분하므로 별도 카드가 필요 없다.
     (지연 상세 분석은 지연현황 화면 전담) */
  /* 관리자의 '독촉 대상' = 승인된 실적이 없고 착수일이 지난 건.
     단 승인대기 건은 이미 승인함에서 처리 중이므로 독촉 대상이 아니다 (V74). */
  const todoAll = isWorker()
    ? todoRows().filter(r=>dayDiff(r.a.planStart, TODAY) >= 0 || r.late)
    : list.filter(a=>apprRate(a)==null && dayDiff(a.planStart, TODAY) >= 0
                     && statusOf(a,'intake') !== 'wait')
           .map(a=>({a, mode:'intake', key:`${a.id}|intake`, st:statusOf(a,'intake'), late:isLate(a)}));
  // 지연 건 우선 → 지연일수 → 계획완료일
  todoAll.sort((x,y)=>(y.late - x.late)
                   || (lateDays(y.a) - lateDays(x.a))
                   || x.a.planEnd.localeCompare(y.a.planEnd));
  const todo = todoAll.slice(0,8);
  const todoLate = todoAll.filter(r=>r.late).length;   // 이 카드 목록 안의 지연 건수 (V74)
  /* KPI '실적누락'과의 차이를 부제에 밝힌다 — 그 차이는 승인함이 들고 있는 건수다 (V74) */
  const waitExcl = isWorker() ? 0
    : list.filter(a=>apprRate(a)==null && dayDiff(a.planStart, TODAY) >= 0
                     && statusOf(a,'intake')==='wait').length;
  const notis = myNotis().slice(0,6);
  return `
  <div class="kpi-grid">
    <button class="kpi k-none" data-kpi="${view?'miss':'none'}"><div class="lab"><i class="bi bi-exclamation-triangle-fill"></i>실적누락</div>
      <div class="num">${cntNone}<em>건</em></div><div class="k-sub">월간계획착수일 경과 · 승인 실적 없음</div></button>
    <button class="kpi k-wait" ${isManager()||isAdmin()?'data-go="appr"':'data-kpi="wait"'}><div class="lab"><i class="bi bi-hourglass-split"></i>승인대기</div>
      <div class="num">${cntWait}<em>건</em></div><div class="k-sub">${isManager()?'승인함에서 처리':'승인요청 후 대기 중'}</div></button>
    <button class="kpi k-done" data-kpi="${view?'cls':'done'}"><div class="lab"><i class="bi bi-check-circle-fill"></i>${
      view?'종결':'승인완료'}</div>
      <div class="num">${cntDone}<em>건</em></div><div class="k-sub">${
      view?'공정율 100% 승인':'진척 승인 기준'}</div></button>
    <div class="kpi k-late" style="cursor:default"><div class="lab"><i class="bi bi-alarm-fill"></i>지연</div>
      <div class="num">${late.length}<em>건</em></div><div class="k-sub">완료예정일 미지정 ${late.filter(a=>!a.expEnd).length}건${
        riskList().length ? ` · <b style="color:var(--st-risk)">지연 위험 ${riskList().length}건</b>` : ''}</div></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;height:calc(100% - 122px);">
    <div class="card">
      <div class="card-h"><h3>${isWorker()?'처리할 작업':'독촉 대상'}</h3>
        <span class="note" style="margin-left:8px">${
          isWorker()?'입력 대상':'착수일 도래 · 승인 실적 없음'} ${todoAll.length}건${
          waitExcl?` · 승인대기 ${waitExcl}건 제외`:''}${
          todoLate?` · <b style="color:var(--st-late)">지연 ${todoLate}건 우선</b>`:''}</span>
        <span class="sp" style="flex:1"></span>${isManager()||isAdmin()
          ? `<button class="lnk" data-kpi="miss">실적확인 ›</button>`
          : `<button class="lnk" data-go="reg">실적등록 ›</button>`}</div>
      <div class="card-b">${todo.length? todo.map(r=>isWorker()?todoRowHTML(r):rowHTML(r.a,'intake',false)).join('')
        + (todoAll.length>todo.length?`<div class="more-hint">외 ${todoAll.length-todo.length}건</div>`:'')
        : emptyHTML(isWorker()?'처리할 작업이 없습니다':'독촉할 건이 없습니다',
                    isWorker()?'착수일이 도래한 미완료 실적이 없습니다.'
                              :'착수일이 지났는데 승인 실적이 없는 건이 없습니다.')}</div>
    </div>
    <div class="card">
      <div class="card-h"><h3>최근 알림</h3><span class="sp" style="flex:1"></span>
        <span class="note">미읽음 ${myNotis().filter(n=>!n.read).length}건</span></div>
      <div class="card-b">${notis.length? notis.map(notiHTML).join('') : emptyHTML('새로운 알림이 없습니다','')}</div>
    </div>
  </div>`;
}
function emptyHTML(t,s){ return `<div class="empty"><i class="bi bi-inbox"></i><p>${esc(t)}</p>${s?`<small>${esc(s)}</small>`:''}</div>`; }

/* ---------- 목록 행 ---------- */
function rowHTML(a, mode, withCheck){
  const st = statusOf(a, mode);
  const p = perf(a, mode);
  const late = isLate(a);
  /* 관리자 목록(실적확인·홈)은 확정 실적 관점 — 결재 상태는 승인함이 다룬다 (V66) */
  const view = isManager()||isAdmin();
  const cf = confirmState(a);
  const tags = view ? [confirmTag(a)] : [perfTag(a, mode)];
  { const lt = lateOrRiskTag(a); if(lt) tags.push(lt); }
  const right = view ? apprRateCell(a)
    : (p.rate==null ? `<span class="pct none">—</span>`
      : `<div class="mini-bar"><i style="width:${p.rate}%"></i></div><span class="pct">${
          (st==='wait' && p.prevRate!=null)?`<small class="prev">${p.prevRate}→</small>`:''}${p.rate}<small>%</small></span>`);
  const ck = withCheck ? `<span class="ckbox ${S.checked.includes(a.id)?'on':''}" data-check="${a.id}"><i class="bi bi-check-lg"></i></span>` : `<span></span>`;
  // 1행 = 식별(블록·공정), 2행 = 일정. 각 줄이 접히지 않도록 항목을 줄인다.
  const line2 = view
      ? `${esc(a.company)} · <b>${blkLabel(a)}</b> · <span title="작업설명 : ${esc(a.stage)}">${stageOf(a)}</span><br>${
          p.status==='done' && p.approvedAt ? `${esc(p.approvedBy||'')} 승인 ${p.approvedAt}`
          : apprRate(a)!=null ? `시스템 확정 ${apprRate(a)}% · ERP 전송/실적 승인대기`
          : `월간계획 ${dstr(a.planStart)} ~ ${dstr(a.planEnd)} · 승인 이력 없음`}`
    : `${a.id} · ${a.shop}<br>월간계획 ${dstr(a.planStart)} ~ ${dstr(a.planEnd)}`;
  /* 작업자 행의 첫 줄은 블록·작업단계 — 현장이 부르는 이름 (V79) */
  const head1 = view ? a.id : `${blkLabel(a)} <small class="stg" title="작업설명 : ${esc(a.stage)}">${stageOf(a)}</small>`;
  return `<button class="row ${view?ROW_CLS[cf.st]:ROW_CLS[st]} ${late?'k-late':''} ${S.selectedId===a.id?'rowsel':''}" data-row="${a.id}">
    ${ck}<span class="bar"></span>
    <span><span class="m1">${view ? docChip(apprDoc(a), true) : ''}<span class="id">${head1}</span>${tags.join('')}</span>
    <span class="m2">${line2}</span></span>
    <span class="right">${right}</span>
  </button>`;
}

/* ---------- 알림 행 ---------- */
function notiHTML(n){
  const m = NOTI_META[n.type];
  const a = actById(n.act);
  return `<button class="noti ${n.read?'':'unread'}" data-noti="${n.id}">
    <span class="ic ${m.cls}"><i class="bi ${m.ic}"></i></span>
    <span><span class="tt">${docChip(n.doc, true)} ${m.label} · ${n.act}</span>
      <span class="ds">${esc(n.desc)}</span>
      ${a?`<span style="margin-top:6px;display:flex;gap:5px;flex-wrap:wrap;">
        <span class="tag t-gray">${a.hull}</span><span class="tag t-gray" title="작업설명 : ${esc(a.stage)}">${stageOf(a)}</span><span class="tag t-gray">${esc(a.block)}</span></span>`:''}
    </span>
    <span class="tm">${n.time}</span>
  </button>`;
}


/* ============================================================
   화면 : 실적등록 / 실적확인 (목록 + 인스펙터)
   ============================================================ */
function viewReg(){
  const mode = S.regMode;
  const worker = isWorker();
  const todo = worker ? todoRows() : [];
  const isTodo = worker && S.quick === 'todo';
  const list = isTodo ? [] : filteredActs(mode);
  const qc = quickCounts(mode);
  const REG_SORTS = {
    plan:(x,y)=> x.planStart.localeCompare(y.planStart) || x.id.localeCompare(y.id),
    end :(x,y)=> (x.expEnd||x.planEnd).localeCompare(y.expEnd||y.planEnd) || x.id.localeCompare(y.id),
    rate:(x,y)=> (((isManager()||isAdmin())?(apprRate(x)??-1):(perf(x,mode).rate??-1))
                - ((isManager()||isAdmin())?(apprRate(y)??-1):(perf(y,mode).rate??-1)))
                || x.planStart.localeCompare(y.planStart),
    late:(x,y)=> (isLate(y)-isLate(x)) || (lateDays(y)-lateDays(x)) || x.planStart.localeCompare(y.planStart),
  };
  list.sort(REG_SORTS[S.regSort] || REG_SORTS.plan);
  /* 관리자(실적확인) : 확정 실적 관점 — 전체 = 착수 전 + 실적누락 + 진행 중 + 종결 (배타적 4분할).
     승인대기·반려 같은 결재 상태는 승인함이 전담하므로 여기에 두지 않는다 (V66).
     작업자(실적등록) : 본인 결재 상태가 곧 할 일이므로 결재 상태 칩을 유지한다. */
  const quick = isManager()||isAdmin()
    ? [['all','전체',qc.all],['miss','실적누락',qc.miss],['ing','진행 중',qc.ing],
       ['cls','종결',qc.cls],['pre','착수 전',qc.pre]]
    : [['todo','내 할 일',todo.length],['all','전체',qc.all],['none','누락',qc.none],
       ['wait','대기',qc.wait],['done','완료',qc.done],['rej','반려',qc.rej]];
  return `<div class="split">
    <section class="pane">
      <div class="pane-head">
        <span class="cnt">표시 <b>${isTodo?todo.length:list.length}</b>건</span>
        <span class="sp" style="flex:1"></span>
        ${!isTodo && !isWorker() ? `<select class="sel s36" id="reg-sort" title="정렬 기준">
          <option value="plan" ${S.regSort==='plan'?'selected':''}>월간계획착수일순</option>
          <option value="end"  ${S.regSort==='end' ?'selected':''}>월간계획완료일순</option>
          <option value="rate" ${S.regSort==='rate'?'selected':''}>공정율 낮은순</option>
          <option value="late" ${S.regSort==='late'?'selected':''}>지연 우선</option>
        </select>` : ''}
        ${(isManager()||isAdmin()) ? `<button class="btn sm" data-act="exportreg" title="현재 조회 조건의 목록을 엑셀로 내려받습니다"><i class="bi bi-download"></i> 엑셀</button>` : ''}
      </div>
      <div class="quickbar">
        ${quick.map(([k,t,c])=>`<button class="chip ${S.quick===k?'on':''} ${k==='todo'?'todo':''}" data-quick="${k}">${t}<span class="n">${c}</span></button>`).join('')}
      </div>
      <div class="pane-body" id="reglist">
        ${isTodo
          ? (todo.length ? todo.map(todoRowHTML).join('')
             : emptyHTML('입력할 실적이 없습니다','누락 · 반려 건과 진척 입력 대상이 모두 처리되었습니다.'))
          : (list.length? list.map(a=>rowHTML(a,mode,false)).join('')
             : emptyHTML('조회 결과가 없습니다','필터 또는 검색 조건을 변경해 주세요.'))}
      </div>
    </section>
    <section class="pane ${S.selectedId?'':'hide'}">${inspectorHTML()}</section>
  </div>`;
}

/* '내 할 일' 행 — 해야 할 일(신규 입력 / 재입력)을 명시한다 */
function todoRowHTML(r){
  /* '전체' 탭(rowHTML)과 같은 카드 문법 — 통합 목록 고유 정보(실적구분 태그 · 기한)만 추가 (V57) */
  const {a, mode, st} = r;
  const sel = S.selectedId===a.id && S.tab===mode;
  const p = perf(a, mode);
  const tags = [perfTag(a, mode)];
  { const lt = lateOrRiskTag(a); if(lt) tags.push(lt); }
  const right = rateCell(a, mode);
  const line2 = `<b>${blkLabel(a)}</b> · <span title="작업설명 : ${esc(a.stage)}">${stageOf(a)}</span> · ${a.shop}<br>월간계획 ${
    dstr(a.planStart)} ~ ${dstr(a.planEnd)}`;
  const d = dayDiff(TODAY, a.planEnd);
  return `<button class="row ${ROW_CLS[st]} ${r.late?'k-late':''} ${sel?'rowsel':''}" data-arow="${r.key}">
    <span></span><span class="bar"></span>
    <span><span class="m1"><span class="id">${blkLabel(a)} <small class="stg" title="작업설명 : ${esc(a.stage)}">${stageOf(a)}</small></span>${tags.join('')}</span>
    <span class="m2">${a.id} · ${a.shop}<br>월간계획 ${dstr(a.planStart)} ~ ${dstr(a.planEnd)}</span></span>
    <span class="right">${right}
      <span class="td-due ${d<0?'over':''}">${d<0?`완료일 ${-d}일 경과`:(d===0?'오늘 완료 계획':`완료까지 ${d}일`)}</span>
    </span>
  </button>`;
}

function inspectorHTML(){
  const a = actById(S.selectedId);
  if(!a) return emptyHTML('액티비티를 선택해 주세요','좌측 목록에서 항목을 선택하면 상세 정보와 실적 입력 영역이 표시됩니다.');
  const mode = S.tab==='outtake' ? 'outtake' : 'intake';
  const st = statusOf(a, mode);
  const p = perf(a, mode);
  const mgr = isManager()||isAdmin();
  /* 승인대기 중에는 작업자도 잠근다 — 관리자가 검토 중인 값이 바뀌면 결재가 성립하지 않는다.
     수정하려면 '요청 취소'로 회수한 뒤 재입력 → 재요청한다.
     승인 완료라도 100% 미만이면 다음 진척을 이어서 올릴 수 있다 (V61). */
  const locked = mgr || st==='wait' || isClosed(a) || mode==='outtake';
  const draft = S.draft && S.draft.id===a.id && S.draft.mode===mode ? S.draft : null;
  const rate = draft ? draft.rate
    : ((mgr && S.view!=='appr') ? (apprRate(a) ?? 0) : baseRate(a, mode));
  /* 실적확인은 승인 확정 시점의 워크오더를 보여준다 (V66) */
  const wo = draft ? draft.wo : ((mgr && S.view!=='appr') ? apprWO(a) : a.intake.wo);
  const delayed = draft ? draft.delayed : a.delayed;
  const expEnd = draft ? draft.expEnd : a.expEnd;
  const reason = draft ? draft.reason : a.delayReason;

  /* 결재 상태는 승인함에서만, 실적확인은 확정 실적 상태로 표기한다 (V66) */
  const tags = (mgr && S.view!=='appr')
      ? [`<span class="tag ${ST_CLS[confirmState(a).st]}">${confirmState(a).t}</span>`]
      : [perfTag(a, mode)];
  { const lt = lateOrRiskTag(a); if(lt) tags.push(lt); }

  // 완료예정일 재지정은 액티비티 단위 속성 → 액티비티가 종료(완료 승인)되기 전까지 편집 가능
  const delayLocked = mgr || a.outtake.status === 'done';
  const bodyHTML = inspPerf(a, mode, {rate, wo, delayed, expEnd, reason, locked, st, delayLocked});

  /* 결재(승인·반려·승인취소)는 승인함 전용 — 실적확인은 조회만 한다 (V65) */
  const foot = mgr ? (S.view==='appr' ? footManager(a, mode, st) : footViewOnly(a, mode, st))
                   : footWorker(a, mode, st, draft, rate);

  return `
    <div class="insp-head">
      <div class="t1"><h2>${isWorker() ? `${blkLabel(a)} <small>${stageOf(a)}</small>` : a.id}</h2>${tags.join('')}${
        (isManager()||isAdmin()) && S.view!=='appr' ? docChip(apprDoc(a)) : docChip(perf(a, mode).docNo)}
        <button class="insp-close" data-act="closeinsp" aria-label="목록으로 돌아가기"><i class="bi bi-x-lg"></i></button></div>
      <div class="t2">${isWorker()
        ? `${a.id} · ${a.grp} · ${a.shop}${a.org?' · 정반 '+esc(a.org):''}`
        : `${blkLabel(a)} · ${a.grp} · ${stageOf(a)} · ${a.shop} · ${esc(a.company)}${a.org?' · 정반 '+esc(a.org):''}`}</div>
    </div>
    <div class="insp-body">${bodyHTML.split('<!--RATEDOCK-->')[0]}</div>
    ${bodyHTML.includes('<!--RATEDOCK-->')
      ? `<div class="insp-dock">${bodyHTML.split('<!--RATEDOCK-->')[1]}</div>` : ''}
    <div class="insp-foot">${foot}</div>`;
}

/* 승인 요청 요약 — 관리자가 '이번에 무엇이 올라왔는지'를 첫 화면에서 판단하도록 구성 */
function reviewHTML(a, mode){
  const p = perf(a, mode);
  const cur = p.rate ?? 0;
  const prev = p.prevRate;
  const gap = prev==null ? null : Math.round((cur - prev)*10)/10;
  const g = a.guide[mode];
  const gd = g==null ? null : cur - g;
  // 이번 요청분 W/O : 직전 확정 공정율 이후로 완료된 항목
  const wo = mode==='intake' ? a.intake.wo : [];
  let acc = 0;
  const fresh = wo.filter(w=>{ const s0=acc; if(w.done) acc+=w.weight; return w.done && s0 >= (prev??0); });

  return `
  <div class="rvw">
    <div class="rvw-h"><span class="gt gt-rvw">승인 요청</span>
      ${docChip(p.docNo)}
      <span class="who">${esc(p.requestedBy||'-')} · ${esc(a.company)}</span>
      ${isLate(a) ? `<span class="tag t-late"><i class="bi bi-alarm-fill"></i>지연 D+${lateDays(a)} · 완료예정 ${
        a.expEnd?dstr(a.expEnd):'미지정'}</span>` : ''}
      <span class="sp" style="flex:1"></span>
      <span class="when">${p.requestedAt||'-'}</span></div>

    <div class="rvw-main">
      <div class="rvw-rate">
        <label>공정율</label>
        <div class="v">
          ${prev==null ? `<span class="new">최초 요청</span>` : `<b class="p0">${prev}%</b><i class="bi bi-arrow-right"></i>`}
          <b class="p1">${cur}%</b>
          ${gap==null?'':`<span class="gap ${gap>0?'up':'flat'}">${gap>0?'+':''}${gap}%p</span>`}
        </div>
      </div>
      <div class="rvw-ai">
        <label>AI 예측 대비</label>
        <div class="v">${g==null?'<span class="none">예측값 없음</span>'
          :`<b>${g}%</b><span class="gap ${Math.abs(gd)>=30?'warn':'flat'}">${gd>0?'+':''}${gd}%p</span>`}</div>
      </div>
    </div>

    ${p.rejCount ? `<div class="rvw-rej"><i class="bi bi-arrow-repeat"></i>
      <span><b>${p.rejCount}회 반려</b> 이력${p.rejCode?` · 최근 사유 ${esc(p.rejCode)}`:''}</span></div>` : ''}

    ${mode==='intake' && fresh.length ? `<div class="rvw-wo">
      <label>이번 완료 처리</label>
      <span>${fresh.map(w=>`<span class="tag t-done">${esc(w.name)} · 비중 ${w.weight}%</span>`).join('')}</span>
    </div>` : ''}

  </div>`;
}

/* 처리 이력 — 기록만 되고 노출되지 않던 history 를 상세 하단에 표시 */
/* 접힘 상태 : 그룹 헤더에 얹는 작은 버튼 (독립 행을 쓰지 않아 상세가 밀리지 않는다) */
function histBtnHTML(a){
  if(!a.history.length) return '';
  const docN = a.history.filter(h=>h.doc).length;
  return `<button class="hist-btn ${S.histOpen?'on':''}" data-act="togglehist"
      title="최근 : ${a.history[0].kind} · ${a.history[0].at}">
    <i class="bi bi-clock-history"></i>이력 <b>${a.history.length}</b>
    <span class="hf-n">결재 ${docN}</span>
    <i class="bi bi-chevron-${S.histOpen?'up':'down'}"></i></button>`;
}

function historyHTML(a){
  if(!a.history.length || !S.histOpen) return '';
  const ICON = {'저장':'bi-save','승인요청':'bi-send-check','승인':'bi-check2-circle',
                '반려':'bi-x-circle','승인취소':'bi-arrow-counterclockwise',
                '요청취소':'bi-arrow-counterclockwise','지연':'bi-alarm','종결':'bi-flag-fill',
                '자동':'bi-lightning-charge','이동':'bi-truck'};
  /* V64 : 결재 단계가 하나이므로 착수/완료 필터 대신 '결재 / 입력'으로 나눈다 */
  const docN = a.history.filter(h=>h.doc).length;
  const list = a.history.filter(h=>S.histKind==='all'
                                || (S.histKind==='doc' ? !!h.doc : !h.doc));
  const kinds = [['all','전체',a.history.length],['doc','결재',docN],
                 ['etc','입력 · 기타',a.history.length-docN]];
  return `<div class="hist">
    <div class="hist-h"><h3>처리 이력</h3>
      <span class="hk">${kinds.map(([k,t,c])=>`<button class="${S.histKind===k?'on':''}" data-hkind="${k}">${t} ${c}</button>`).join('')}</span>
      <span class="sp" style="flex:1"></span>
      <span class="meta">일정 · 실적 확인용 · 최신순</span>
      <button class="disc" style="margin-left:8px" data-act="togglehist">접기 <i class="bi bi-chevron-up"></i></button></div>
    ${list.length ? list.map(h=>`<div class="hist-i">
      <i class="bi ${ICON[h.kind]||'bi-dot'} k-${h.kind}"></i>
      <span class="kd">${({'요청취소':'요청 취소','승인취소':'승인 취소'})[h.kind] || h.kind}</span>
      ${docChip(h.doc, true)}
      <span class="dt">${esc(h.detail.replace(/^\[[^\]]+\]\s*/,''))}</span>
      <span class="sp" style="flex:1"></span>
      <span class="at">${esc(h.by)} · ${h.at}</span></div>`).join('')
      : `<div class="more-hint">해당 구분의 이력이 없습니다</div>`}
  </div>`;
}

function inspPerf(a, mode, v){
  const {rate, wo, delayed, expEnd, reason, locked, st, delayLocked} = v;
  const woLocked = locked || mode==='outtake';
  const doneN = wo.filter(w=>w.done).length;
  const woPart = woSplit(wo);                  // 완료 비중 합 · 진행 중 기여분 · 공정율 (V76)
  const sum = woPart.total;
  const g = a.guide[mode];

  return `
  ${(isManager()||isAdmin()) && st==='wait' && S.view==='appr' ? reviewHTML(a, mode) : ''}
  ${S.refOpen ? `
  <div class="grp">
    <div class="grp-h"><span class="gt">액티비티 공통</span>
      <span class="sp" style="flex:1"></span>
      <button class="disc" data-act="toggleref">접기 <i class="bi bi-chevron-up"></i></button></div>

  <div class="kv">
    <div class="i"><label>월간계획착수일</label><strong>${a.planStart}</strong></div>

    <span class="sp" style="flex:1"></span>

      ${mode==='intake' ? `<span class="sp" style="flex:1"></span>

  ${isWorker() && st==='rej' ? `
  <div class="delay-box rej-box" style="margin-bottom:14px;"><i class="bi bi-x-circle-fill" style="color:var(--st-rej)"></i>
    <span class="note b">반려됨${perf(a,mode).rejCode?` · 사유 : ${esc(perf(a,mode).rejCode)}`:''}${

      ? `<div class="wo-sum"><i class="bi bi-check2-square"></i>

            return c && c.part ? ` · 진행 중 ${esc(c.name)} ${c.part}% (+${woSplit(wo).add}%p)` : '';})()}</span>${
            wo.some(w=>w.auto)?`<span class="tag t-wait" title="물류Twin 배차 완료 수신으로 자동 완료된 워크오더 — 저장까지 자동, 승인요청은 작업자 확인 후">자동 ${wo.filter(w=>w.auto).length}건 · 물류Twin</span>`:''}</div>`
      : `<div class="sec" title="후행 워크오더를 완료 처리하면 선행 항목이 함께 완료되고, 선행을 해제하면 후행이 함께 해제됩니다.">
    <div class="wo-steps">
      ${(()=>{ const pv = perf(a,mode).prevRate; let ac=0;
        const nextIdx = woLocked ? -1 : wo.findIndex(x=>!x.done);   // 다음에 누를 카드 (V79)
        return wo.map((w,i)=>{ const s0=ac; if(w.done) ac+=w.weight;
          const isNew = w.done && pv!=null && s0>=pv;
          return `<button class="wo-step ${w.done?'done':''} ${isNew?'fresh':''} ${i===nextIdx?'next':''}" data-wo="${i}" ${woLocked?'disabled':''}>
        ${i===nextIdx?'<span class="badge-next">다음</span>':''}

          ''}</span>

          !w.done && w.part ? ` · <b class="wp" title="이 워크오더의 진척이 공정율에 더하는 몫">진행 ${
            w.part}% <span class="wp-add">+${woSplit(wo).add}%p</span></b>` : ''}</span></button>`;
        }).join(''); })()}
    </div>
    ${wo.some(w=>w.auto)?`<div class="wo-autonote"><i class="bi bi-truck"></i>
      <span>물류Twin 자동 완료 : ${wo.filter(w=>w.auto).map(w=>
        `<b>${esc(w.name)}</b> — ${w.auto.no} · ${esc(w.auto.veh)} · ${w.auto.at.slice(5)}`).join('  /  ')}</span>

  </div>
  ${historyHTML(a)}

      <div class="rate-cmp">

`;

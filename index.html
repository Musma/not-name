function ctEditWO(id,index){
 if(!v88manager())return;const original=ctGet(id);if(!original||!original.wo[index])return;
 const draft=v88copy(original),w=draft.wo[index],revision=ctCfg().version;
 v88modal('W/O 개별 수정',`<p><b>${esc(original.label)}</b> · ${index+1}번 작업</p><div class="ct-form">${[['code','세부분류코드'],['ser','W/O순번'],['name','작업내용'],['weight','비중 (%)']].map(([k,label])=>`<label>${label}<input class="inp" data-ct-one="${k}" value="${esc(w[k])}" ${k==='weight'?'type="number" min="0" max="100" step="0.1"':''}></label>`).join('')}</div><p class="ct-note" id="ct-one-total">전체 비중 합계 ${draft.wo.reduce((n,w)=>n+w.weight,0)}%</p><label>변경 사유<input class="inp" id="ct-one-reason"></label><p class="ct-note">선택한 W/O만 변경합니다. 다른 작업의 비중도 조정해야 한다면 ‘전체 구성 수정’으로 이어서 편집하세요.</p><div id="ct-one-error" class="ct-error" role="alert" hidden></div>`,`<button class="btn" id="ct-one-full">전체 구성 수정</button><button class="btn pri" id="ct-one-save">이 W/O 저장</button>`);
 document.querySelectorAll('[data-ct-one]').forEach(el=>el.oninput=()=>{const k=el.dataset.ctOne;w[k]=k==='weight'?(el.value===''?NaN:Number(el.value)):el.value.trim();$('#ct-one-total').textContent='전체 비중 합계 '+draft.wo.reduce((n,w)=>n+w.weight,0)+'%';});
 const showError=message=>{const el=$('#ct-one-error');el.hidden=false;el.textContent=message;};
 $('#ct-one-full').onclick=()=>{if(revision!==ctCfg().version)return showError('설정이 바뀌었습니다. 다시 열어 주세요.');ctEdit(id,draft,$('#ct-one-reason').value);};
 $('#ct-one-save').onclick=()=>{try{
  if(revision!==ctCfg().version)throw Error('설정이 바뀌었습니다. 다시 열어 주세요.');
  if(ctComparable(original)===ctComparable(draft))throw Error('변경한 내용이 없습니다.');
  ctApply([{id,action:'수정',row:draft}],$('#ct-one-reason').value.trim());S.ctSelected=id;$('#backdrop').classList.remove('on');render();toast('선택한 W/O 수정 완료','ok');
 }catch(err){showError(err.message);}};
}

function ctEdit(id,initialDraft=null,initialReason=''){
 if(!v88manager())return;const original=id?ctGet(id):null;if(id&&!original)return;
 const draft=original?v88copy(initialDraft||original):{id:'USER-'+Date.now(),activityName:S.ctName||'',label:'',wo:[{code:'',ser:'01',name:'',weight:100}],sources:[]};let reason=initialReason;const revision=ctCfg().version;
 const draw=()=>{
  v88modal(original?'공통 유형 수정':'공통 유형 추가',`<div class="ct-form"><label>유형 ID<input class="inp" data-ctf="id" value="${esc(draft.id)}" ${original?'readonly':''}></label><label>Activity 명칭<input class="inp" data-ctf="activityName" value="${esc(draft.activityName)}" placeholder="예: PE"></label><label>공통 유형명<input class="inp" data-ctf="label" value="${esc(draft.label)}" placeholder="예: PE 기본형"></label></div><div class="ct-scroll"><table class="ct-table"><thead><tr><th>순서</th><th>세부분류코드</th><th>W/O순번</th><th>작업내용</th><th>비중 %</th><th></th></tr></thead><tbody>${draft.wo.map((w,i)=>`<tr><td>${i+1}</td>${['code','ser','name','weight'].map(k=>`<td><input class="inp" data-ctw="${i}:${k}" style="width:${k==='name'?180:75}px" value="${esc(w[k]??'')}" ${k==='weight'?'type="number" min="0" max="100" step="0.1"':''}></td>`).join('')}<td><button class="btn" data-ct-up="${i}" ${i===0?'disabled':''} aria-label="위로">↑</button><button class="btn" data-ct-rm="${i}">삭제</button></td></tr>`).join('')}</tbody></table></div><div class="ct-toolbar"><button class="btn" id="ct-wo-add">+ W/O 추가</button><span id="ct-edit-sum">합계 ${draft.wo.reduce((n,w)=>n+w.weight,0)}%</span></div><label>변경 사유<input id="ct-reason" class="inp" value="${esc(reason)}"></label><p class="ct-note">코드·W/O순번는 식별 정보입니다. 서로 다른 코드의 같은 W/O순번는 허용합니다. 기존 실적·승인 이력은 유지됩니다.</p><div id="ct-edit-errors" class="ct-error" role="alert"></div>`,`<button class="btn pri" id="ct-save">저장</button>`);
  document.querySelectorAll('[data-ctf]').forEach(el=>el.oninput=()=>draft[el.dataset.ctf]=el.value.trim());
  document.querySelectorAll('[data-ctw]').forEach(el=>el.oninput=()=>{const [i,k]=el.dataset.ctw.split(':');draft.wo[i][k]=k==='weight'?(el.value===''?NaN:Number(el.value)):el.value.trim();$('#ct-edit-sum').textContent='합계 '+draft.wo.reduce((n,w)=>n+w.weight,0)+'%';});
  $('#ct-reason').oninput=e=>reason=e.target.value;
  $('#ct-wo-add').onclick=()=>{draft.wo.push({code:'',ser:'',name:'',weight:0});draw();};
  document.querySelectorAll('[data-ct-rm]').forEach(el=>el.onclick=()=>{draft.wo.splice(+el.dataset.ctRm,1);draw();});
  document.querySelectorAll('[data-ct-up]').forEach(el=>el.onclick=()=>{const i=+el.dataset.ctUp;[draft.wo[i-1],draft.wo[i]]=[draft.wo[i],draft.wo[i-1]];draw();});
  $('#ct-save').onclick=()=>{try{if(revision!==ctCfg().version)throw Error('설정이 변경되었습니다. 다시 열어 주세요.'.replace('設定','설정'));if(original&&ctComparable(original)===ctComparable(draft))throw Error('변경한 내용이 없습니다.');ctApply([{id:draft.id,action:original?'수정':'추가',row:draft}],reason.trim());S.ctSelected=draft.id;$('#backdrop').classList.remove('on');render();toast('공통 유형 저장 완료','ok');}catch(err){$('#ct-edit-errors').textContent=err.message;}};
 };draw();
}
function ctDelete(id){
 if(!v88manager())return;const r=ctGet(id);if(!r)return;
 const uses=DB.acts.filter(a=>a.templateId===id).length;
 v88modal('공통 유형 삭제',`<p><b>${esc(r.label)}</b></p><p>유형 목록과 이후 수신 선택에서 제외합니다. 이미 수신된 Activity ${uses}건의 W/O·실적·승인 이력은 유지됩니다.</p><label>삭제 사유<input class="inp" id="ct-delete-reason"></label>`,`<button class="btn no" id="ct-delete-confirm">삭제</button>`);

const CT_WO_HEADERS=['유형ID','순서','세부분류코드','W/O순번','작업내용','비중'];
function ctExportSheets(){const rows=ctCatalog();return [
 {name:'Activity',rows:[CT_HEADERS,...rows.map(r=>['수정',r.id,r.activityName,r.label])],widths:[12,25,24,40]},
 {name:'WO',rows:[CT_WO_HEADERS,...rows.flatMap(r=>r.wo.map((w,i)=>[r.id,i+1,w.code,w.ser,w.name,w.weight]))],widths:[25,10,18,14,38,12]},
 {name:'원본연결',rows:[['유형ID','원본Activity','표준호선','블록'],...rows.flatMap(r=>ctSources(r).map(s=>[r.id,s.activity,s.hull,s.block]))],widths:[25,30,16,16]},
 {name:'안내',rows:[['항목','편집 방법'],['전체 내보내기','현재 필터와 무관하게 활성 공통 유형 전체를 내보냅니다.'],['처리','추가 / 수정 / 삭제 / 유지. 파일에서 행을 빼도 삭제되지 않습니다. 삭제는 Activity 시트 처리 열에 명시합니다.'],['수정','수정할 유형의 W/O 전체를 WO 시트에 남겨 주세요. 순서 열은 1부터 연속된 정수입니다.'],['문자열','유형ID·세부분류코드·W/O순번는 텍스트로 입력합니다. 앞자리 0을 유지합니다.'],['비중','숫자 0~100, 유형별 합계 100. 수식은 값으로 붙여넣기 하세요.'],['기존 오류','원본 확인 필요 유형은 바꾸지 않으면 그대로 둡니다. 바꾼 유형은 검증을 통과해야 적용됩니다.'],['적용','업로드 후 변경 전후를 확인하고 일괄 적용합니다. 오류가 하나라도 있으면 적용하지 않습니다.'],['원본연결','조회용입니다. 이 시트 수정은 반영되지 않습니다. 공통 유형은 원본 Activity 번호와 별개로 관리합니다.'],['실적','템플릿 변경·삭제는 기존 Activity의 W/O·실적·승인 이력을 바꾸지 않습니다.']],widths:[18,110]}
];}
function ctExport(){if(v88manager())downloadBlob(xlsxBlob(ctExportSheets()),'공정템플릿_공통유형_'+TODAY.replaceAll('-','')+'.xlsx');}
function ctImportPlan(book){
 // 이전에 내보낸 영문 열 제목도 입력용 별칭으로 허용한다.
 if(book.WO?.[0]?.values[3]==='SERNO')book={...book,WO:[{...book.WO[0],values:book.WO[0].values.map((v,i)=>i===3?'W/O순번':v)},...book.WO.slice(1)]};
 const errors=[],changes=[],a=book.Activity,w=book.WO;
 const exact=(rows,h)=>rows&&h.every((v,i)=>rows[0]?.values[i]===v);
 if(!exact(a,CT_HEADERS)||!exact(w,CT_WO_HEADERS))return {errors:['Activity / WO 시트와 열 제목이 다릅니다. 공통 유형 내보내기 파일을 사용하세요.'],changes};
 const groups=new Map(),seen=new Set();
 for(const {line,values:v} of w.slice(1)){const id=String(v[0]||'').trim();if(!id){errors.push('WO '+line+'행: 유형ID 필수');continue;}if(!groups.has(id))groups.set(id,[]);groups.get(id).push({line,values:v});}
 for(const {line,values:v} of a.slice(1)){
  const action=String(v[0]||'').trim(),id=String(v[1]||'').trim();if(!id||seen.has(id)){errors.push('Activity '+line+'행: ID 누락 또는 중복');continue;}seen.add(id);
  if(!['추가','수정','삭제','유지'].includes(action)){errors.push(id+': 처리 구분 확인');continue;}const old=ctGet(id);if(action==='유지')continue;
  if(action==='삭제'){changes.push({id,action});continue;}
  const wr=groups.get(id)||[];const sorted=wr.slice().sort((a,b)=>Number(a.values[1])-Number(b.values[1]));
  const row={id,activityName:String(v[2]??'').trim(),label:String(v[3]??'').trim(),sources:old?.sources||[],wo:sorted.map(({values:z})=>({code:String(z[2]??'').trim(),ser:String(z[3]??'').trim(),name:String(z[4]??'').trim(),weight:typeof z[5]==='number'?z[5]:NaN}))};
  const unchanged=action==='수정'&&old&&ctComparable(old)===ctComparable(row);
  if(typeof v[1]!=='string')errors.push(id+': 유형ID는 텍스트로 입력');
  if(sorted.some(({values:z},i)=>!Number.isInteger(z[1])||z[1]!==i+1))errors.push(id+': W/O 순서는 1부터 연속된 정수');
  // 원본의 빈 코드까지 수정 없이 왕복할 수 있다. 변경된 유형에만 완전성을 요구한다.
  if(unchanged)continue;
  for(const {line:wl,values:z} of wr)if([0,2,3].some(i=>typeof z[i]!=='string'))errors.push('WO '+wl+'행: 유형ID·코드·W/O순번는 텍스트');
  changes.push({id,action,row});
 }
 for(const id of groups.keys())if(!seen.has(id))errors.push('WO '+id+': Activity 시트에 없는 유형');
 errors.push(...ctValidateChanges(changes));return {errors:[...new Set(errors)],changes};
}
function ctChangeHTML(c){
 const old=ctGet(c.id);if(c.action==='삭제')return '유형 제외 · 기존 실적 유지';
 const r=c.row;const fields=[['activityName','Activity 명칭'],['label','유형명']].filter(([k])=>old?.[k]!==r[k]).map(([k,n])=>`${n}: ${esc(old?.[k]||'없음')} → ${esc(r[k])}`).join('<br>');
 return `W/O ${old?.wo.length||0} → ${r.wo.length}개<details><summary>변경 전후 상세</summary>${fields}<div class="ct-scroll"><table class="ct-table"><thead><tr><th>순서</th><th>이전 코드 / W/O순번 / 작업 / 비중</th><th>변경 코드 / W/O순번 / 작업 / 비중</th></tr></thead><tbody>${Array.from({length:Math.max(old?.wo.length||0,r.wo.length)},(_,i)=>{const describe=w=>w?esc([w.code,w.ser,w.name,w.weight+'%'].join(' / ')):'없음';return `<tr><td>${i+1}</td><td>${describe(old?.wo[i])}</td><td>${describe(r.wo[i])}</td></tr>`;}).join('')}</tbody></table></div></details>`;
}
function ctPreview(plan){
 const revision=ctCfg().version;const count=s=>plan.changes.filter(c=>c.action===s).length;
 v88modal('엑셀 변경 내역 확인',`<p>추가 ${count('추가')} · 수정 ${count('수정')} · 삭제 ${count('삭제')} · 오류 ${plan.errors.length}</p>${plan.errors.length?`<div class="ct-error" role="alert">${plan.errors.slice(0,50).map(esc).join('<br>')}${plan.errors.length>50?'<br>외 '+(plan.errors.length-50)+'건':''}</div>`:''}<div class="ct-scroll"><table class="ct-table"><thead><tr><th>처리</th><th>유형ID</th><th>변경 내용</th></tr></thead><tbody>${plan.changes.map(c=>`<tr><td>${c.action}</td><td>${esc(c.id)}</td><td>${ctChangeHTML(c)}</td></tr>`).join('')||'<tr><td colspan="3">변경한 내용이 없습니다.</td></tr>'}</tbody></table></div><label>일괄 변경 사유<input class="inp" id="ct-import-reason"></label><p class="ct-note">오류가 있으면 전체 적용을 보류합니다. 누락된 유형은 삭제하지 않습니다.</p>`,`<button class="btn pri" id="ct-import-apply" ${plan.errors.length||!plan.changes.length?'disabled':''}>변경 ${plan.changes.length}건 적용</button>`);
 $('#ct-import-apply').onclick=()=>{try{if(plan.errors.length)throw Error('오류를 수정한 뒤 다시 업로드해 주세요.');if(revision!==ctCfg().version)throw Error('설정이 바뀌었습니다. 파일을 다시 업로드해 주세요.');ctApply(plan.changes,$('#ct-import-reason').value.trim());S.ctSelected=null;$('#backdrop').classList.remove('on');render();toast('공통 유형 일괄 적용 완료','ok');}catch(err){toast(err.message,'warn');}};
}
v88newWO=function(id){const r=ctResolve({templateId:id});return r?r.wo.map(w=>({code:w.code,ser:w.ser,name:w.name,weight:w.weight,done:false,part:0,start:null,end:null,source:'공통 유형 '+r.label})):null;};
v88createActivity=function(id){
 if(!v88manager())return null;const r=ctResolve({templateId:id}),wo=v88newWO(id);if(!r||!wo){toast('공통 유형을 지정하고 구성·비중을 확인해 주세요.','warn');return null;}
 const ref=ACTIVITY_TEMPLATE_SOURCE.find(a=>ctSources(r).some(s=>s.activity===a.activity));
 const a={id:'DEMO-'+Date.now()+'-'+(DB.acts.length+1),hull:ref?.hull||'DEMO',block:ref?.block||'예시',stage:r.activityName,gcode:ref?.gcode||'',hcode:ref?.hcode||'',icode:ref?.icode||'',jcode:ref?.jcode||'',kcode:ref?.kcode||'',grp:GRP_OF[ref?.gcode]||'기타',shop:'',org:'',company:'청정',qty:null,planStart:TODAY,planEnd:TODAY,actStart:null,actEnd:null,vcode:'A',delayed:false,expEnd:null,delayReason:'',preEnd:null,guide:{intake:null,outtake:null},history:[],mock:true,templateId:r.id,templateVersion:r.version||1,
 intake:{wo:v88copy(wo),rate:null,prevRate:null,status:'none'},outtake:{rate:null,prevRate:null,status:'none',auto:true},v88:{wo,revision:0,weightVersion:r.label+' V'+(r.version||1),events:[],protected:[],erp:[],request:null,draft:null,last:null,hasActual:false}};
 DB.acts.push(a);v88sync(a);v88log(a,'기준정보','신규 수신 예시 · 공통 유형 '+r.id+' / '+r.label);persist();return a;
};
v88intakeModal=function(){
 if(!v88manager())return;S.sfpoOpen=false;render();const catalog=ctCatalog();
 v88modal('신규 Activity 수신 (모의)',`<div class="ct-form"><label>Activity 명칭<select id="ct-intake-name">${[...new Set(catalog.map(r=>r.activityName))].sort().map(n=>`<option>${esc(n)}</option>`).join('')}</select></label><label>공통 유형<select id="ct-intake-type"></select></label><label>담당 협력사<select id="ct-intake-company">${[...new Set(DB.acts.map(a=>a.company).filter(Boolean))].map(n=>`<option>${esc(n)}</option>`).join('')}</select></label></div><p id="ct-intake-summary"></p><p class="ct-note">실제 Activity는 ERP에서 수신합니다. 명칭에 여러 유형이 있으면 연결할 유형을 지정해야 합니다. 이 화면은 별도 DEMO Activity를 만드는 체험입니다.</p>`,`<button class="btn pri" id="ct-intake-run">수신 후 목록에 반영</button>`);
 const update=()=>{const r=ctGet($('#ct-intake-type').value);$('#ct-intake-summary').textContent=r?ctSummary(r):'공통 유형을 선택해 주세요.';$('#ct-intake-run').disabled=!r||!!ctIssues(r).length;};
 const names=()=>{const options=catalog.filter(r=>r.activityName===$('#ct-intake-name').value);$('#ct-intake-type').innerHTML='<option value="">유형 선택</option>'+options.map(r=>`<option value="${esc(r.id)}" ${ctIssues(r).length?'disabled':''}>${esc(r.label)}${ctIssues(r).length?' · 확인 필요':''}</option>`).join('');if(options.length===1&&!ctIssues(options[0]).length)$('#ct-intake-type').value=options[0].id;update();};
 $('#ct-intake-name').onchange=names;$('#ct-intake-type').onchange=update;names();
 $('#ct-intake-run').onclick=()=>{const a=v88createActivity($('#ct-intake-type').value);if(!a)return;a.company=$('#ct-intake-company').value;SFPO.hist.unshift({at:v88now(),mode:'신규 수신 (모의)',total:1,wo:a.v88.wo.length,added:1,changed:0,st:'정상',mock:true,act:a.id});pushNoti({act:a.id,type:'activity',to:a.company,role:'worker',desc:'신규 Activity가 수신되었습니다.'});$('#backdrop').classList.remove('on');Object.assign(S,{view:'reg',regMode:'intake',tab:'intake',quick:'all',hull:'all',block:'all',company:'all',stage:'all',grp:'all',dRange:{basis:'plan',from:'',to:''},keyword:'',selectedId:a.id});persist();render();toast('공통 유형의 W/O를 적용했습니다.','ok');};
};

resetAll(true);                         // 저장된 상태가 있으면 이어서, 없으면 시드로 (V80)
document.addEventListener('click', e=>{
  if(S.sfpoOpen && !e.target.closest('.sfpo-wrap')){ S.sfpoOpen = false; render(); }
  if(S.drOpen && !e.target.closest('.fb-date')){ S.drOpen = false; render(); }
  if(!S.histOpen) return;
  if(e.target.closest('.hist') || e.target.closest('[data-act="togglehist"]')) return;
  S.histOpen = false; render();
});   /* 캡처 단계에서 다시 그리면 누른 요소가 사라져 클릭이 유실될 수 있어 버블 단계로 (V80) */
window.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ const bd=$('#backdrop'); if(bd.classList.contains('on')) bd.classList.remove('on');
    else if(S.sfpoOpen){ S.sfpoOpen=false; render(); }
    else if(S.drOpen){ S.drOpen=false; render(); }
    else if(S.histOpen){ S.histOpen=false; render(); } }
});
</script>
</body>
